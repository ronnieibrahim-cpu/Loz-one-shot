name: Deploy to GitHub Pages

# Publishes dist/oracle-of-tides.html as the site's index.html on every push
# to main. The build itself has no server dependency (see tools/build.mjs),
# so this workflow only exists to run the build, prove the result actually
# boots (tools/check-build.mjs — the deploy fails if that fails, on purpose;
# a build that hasn't passed its own gate is never published), and hand the
# single file to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # Gate: a build that fails check-build.mjs must never reach Pages.
      - run: node tools/check-build.mjs

      - run: |
          mkdir -p _site
          cp dist/oracle-of-tides.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
