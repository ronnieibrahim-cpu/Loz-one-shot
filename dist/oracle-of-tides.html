<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>The Legend of Zelda: Oracle of Tides</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0f14;overflow:hidden;
    font-family:monospace;color:#8fa}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #screen{
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    background:#000;
    box-shadow:0 0 0 4px #1a2530, 0 0 48px rgba(60,120,90,.25);
  }
  #shell{position:relative}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b0f14;z-index:10;font-size:13px;letter-spacing:1px}
  #boot.hidden{display:none}
  #err{position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;
    background:#2a0d12;color:#ffb3c0;font-size:11px;padding:8px;white-space:pre-wrap;
    display:none;z-index:20;border-top:2px solid #ff5c7a}
  /* Touch controls: only shown on touch devices */
  #touch{position:fixed;inset:0;z-index:5;display:none;touch-action:none}
  body.touch #touch{display:block}
  .tbtn{position:absolute;border-radius:50%;background:rgba(200,230,210,.13);
    border:2px solid rgba(200,230,210,.28);color:#cfe;display:flex;
    align-items:center;justify-content:center;font-size:14px;user-select:none}
  .tbtn.act{background:rgba(200,230,210,.35)}
  #dpad{position:absolute;left:4%;bottom:6%;width:150px;height:150px}
  #dpad .tbtn{width:48px;height:48px;border-radius:8px}
  #btns{position:absolute;right:5%;bottom:8%;width:170px;height:130px}
  #btns .tbtn{width:58px;height:58px}
  #sysbtns{position:absolute;right:5%;top:4%}
  #sysbtns .tbtn{width:46px;height:30px;border-radius:6px;position:relative;
    display:inline-flex;margin-left:6px;font-size:10px}
</style>
</head>
<body>
<div id="boot">LOADING&hellip;</div>
<div id="wrap"><div id="shell"><canvas id="screen" width="160" height="144"></canvas></div></div>
<div id="touch">
  <div id="dpad">
    <div class="tbtn" data-k="up"    style="left:51px;top:0"></div>
    <div class="tbtn" data-k="left"  style="left:0;top:51px"></div>
    <div class="tbtn" data-k="right" style="left:102px;top:51px"></div>
    <div class="tbtn" data-k="down"  style="left:51px;top:102px"></div>
  </div>
  <div id="btns">
    <div class="tbtn" data-k="b" style="left:0;top:36px">B</div>
    <div class="tbtn" data-k="a" style="left:86px;top:0">A</div>
  </div>
  <div id="sysbtns">
    <div class="tbtn" data-k="select">SEL</div>
    <div class="tbtn" data-k="start">START</div>
  </div>
</div>
<div id="err"></div>
<script>
  // Surface load/runtime errors on-screen; a black canvas is useless for debugging.
  (function(){
    var box = document.getElementById('err');
    function show(msg){
      box.style.display='block';
      box.textContent += msg + '\n';
      document.getElementById('boot').classList.add('hidden');
    }
    window.addEventListener('error', function(e){
      show('ERROR: ' + (e.message||e.type) + (e.filename? ('\n  at '+e.filename+':'+e.lineno):''));
    });
    window.addEventListener('unhandledrejection', function(e){
      show('PROMISE REJECTION: ' + (e.reason && (e.reason.stack||e.reason.message) || e.reason));
    });
    window.__showError = show;
  })();
</script>

    }
    // Sword hold: keeping the button down after the swing keeps the blade out
    // (see updateSwordHold) and, past a threshold, charges a spin.
    const slot = this.swordSlot(game);
    if (slot && hasItem(game.progress, 'sword') && !this.inDeep) {
      if (i.down(slot) && this.swinging === 0) {
        this.charge++;
        if (this.charge === CHARGE_FRAMES) game.audio.sfx('charged');
        if (this.charge > CHARGE_FRAMES && this.charge % CHARGE_SPARKLE_EVERY === 0) {
          const s = CHARGE_SPARKLE_SPREAD / 2;
          game.spawnEffect('sparkle',
            this.x + game.rng.range(-s, s), this.y + game.rng.range(-s, s), { life: 12 });
        }
      } else if (i.released(slot)) {
        if (this.charge >= CHARGE_FRAMES) this.startSpin(game);
        this.charge = 0;
      }
    } else {
      this.charge = 0;
    }
    // Mermaid Suit dive
    if (this.inDeep && itemLevel(game.progress, 'flippers') >= 2 && i.pressed('a')) {
      this.diving = this.diving > 0 ? 0 : DIVE_FRAMES;
      game.audio.sfx('dive');
    }
  }

  /** Talk to NPCs, read signs, open chests, grab blocks. */
  tryContextAction(game) {
    const [dx, dy] = DIR_VEC[this.dir];
    const px = this.cx + dx * CONTEXT_REACH, py = this.cy + dy * CONTEXT_REACH;
    // entities first
    for (const e of game.entities) {
      if (e.interact && !e.dead) {
        const r = e.rect();
        if (px >= r.x - 4 && px <= r.x + r.w + 4 && py >= r.y - 4 && py <= r.y + r.h + 4) {
          e.interact(game, this);
          return true;
        }
      }
    }
    // then tiles (signs, readable objects, doors needing keys)
    const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
    if (game.tileInteract(tx, ty, this)) return true;
    return false;
  }

  // -------------------------------------------------------------- movement

  updateMovement(game) {
    const i = game.input;
    let dx = 0, dy = 0;
    if (i.down('left')) dx -= 1;
    if (i.down('right')) dx += 1;
    if (i.down('up')) dy -= 1;
    if (i.down('down')) dy += 1;

    // Attacking roots you in place, as in the GBC games.
    if (this.swinging > 0) { this.animT++; return; }

    if (dx || dy) {
      if (!(this.jumping && this.lockDir)) {
        // Face the newly pressed axis so turning is responsive.
        if (dy && !this._lastDy) this.dir = dy < 0 ? 'up' : 'down';
        else if (dx && !this._lastDx) this.dir = dx < 0 ? 'left' : 'right';
        else if (dx && !dy) this.dir = dx < 0 ? 'left' : 'right';
        else if (dy && !dx) this.dir = dy < 0 ? 'up' : 'down';
      }
    }
    this._lastDx = dx; this._lastDy = dy;

    // Speeds are subpixels per frame. The terrain multipliers are
    // dimensionless, so their product has to land back on a whole subpixel
    // before it reaches the mover — and never on zero, or slow ground would be
    // a wall.
    let speed = this.speedBoost > 0 ? BOOST_SPEED : WALK_SPEED;
    if (this.inDeep) speed = this.diving > 0 ? DIVE_SPEED : SWIM_SPEED;
    else if (this.shielding) speed = SHIELD_SPEED;
    else if (this.holding) speed = SWORD_HOLD_SPEED;
    const f = groundFlags(game, this);
    let mult = 1;
    if ((f & F.SLOW) && this.z <= 2) mult *= SLOW_FACTOR;
    if (this.inShallow && this.z <= 2) mult *= SHALLOW_FACTOR;
    if (this.carrying) mult *= CARRY_FACTOR;
    if (mult !== 1) speed = Math.max(1, Math.round(speed * mult));

    // DIAGONALS ARE NOT NORMALISED. `dx` and `dy` stay at ±1 and both axes get
    // the full step, so holding two directions moves sqrt(2) times as far as
    // holding one. That is deliberate and it is a signature of the source
    // games; see docs/FEEL-SPEC.md.

    // A hop in progress owns the controls until it lands.
    if (this.ledgeHop) { this.updateLedgeHop(game); this.animT++; return; }
    if ((dx || dy) && this.tryLedgeHop(game, dx, dy)) { this.animT++; return; }

    if (dx || dy) {
      const res = moveEntity(game, this, dx * speed, dy * speed);
      this.animT++;
      // Pushing against a wall: show the push pose and try to shove blocks.
      this.pushing = (res.hitX && dx !== 0) || (res.hitY && dy !== 0);
      if (this.pushing) this.tryPush(game, dx, dy);
    } else {
      this.pushing = false;
      if (this.inDeep) this.animT++;      // treading water keeps animating
    }
  }

  // ------------------------------------------------------------ one-way ledge
  //
  // `F.LEDGE` and a tile's `ledge` direction have existed in the tileset since
  // the world was built, and nothing under src/game ever read either — the tile
  // was a decorative floor. A ledge is one-way in two halves, and both are
  // needed for it to mean anything:
  //
  //   * walking into its face from the uphill side launches a hop that carries
  //     you clear of it (here), and
  //   * the tile is solid from every other side (room.solidAt), so you cannot
  //     walk back up or stroll along the lip.
  //
  // The hop refuses to start unless the landing tile is standable, because a
  // ledge that drops you into a wall is worse than one that does not fire.

  /** Start a hop if the player is walking into the face of a ledge. */
  tryLedgeHop(game, dx, dy) {
    if (this.jumping || this.z > 0 || this.inDeep || this.carrying) return false;
    const room = game.room;
    if (!room) return false;
    // A diagonal press picks its dominant axis: a ledge only faces a cardinal.
    let ux = 0, uy = 0;
    if (Math.abs(dx) > Math.abs(dy)) ux = Math.sign(dx);
    else if (Math.abs(dy) > 0) uy = Math.sign(dy);
    if (!ux && !uy) return false;
    const facing = ux ? (ux < 0 ? 'left' : 'right') : (uy < 0 ? 'up' : 'down');

    const tx = Math.floor((this.cx + ux * LEDGE_PROBE_REACH) / TILE);
    const ty = Math.floor((this.cy + uy * LEDGE_PROBE_REACH) / TILE);
    const def = this.tileDefAt(game, tx, ty);
    if (!def || !(def.flags & F.LEDGE) || def.ledge !== facing) return false;

    // Clear the lip and everything else flagged as ledge behind it, then land.
    let n = 1;
    while (n < LEDGE_MAX_SPAN) {
      const d = this.tileDefAt(game, tx + ux * n, ty + uy * n);
      if (!d || !(d.flags & F.LEDGE)) break;
      n++;
    }
    // Land squared onto the tile past the drop on the hop axis only; the other
    // axis keeps whatever the player had, so the hop does not slide sideways.
    const land = {
      x: ux ? (tx + ux * n) * TILE : this.x,
      y: uy ? (ty + uy * n) * TILE : this.y,
    };
    if (!canOccupy(game, this, land.x, land.y, { jumping: false, swim: this._flippers, cutting: false })) {
      return false;
    }

    this.ledgeHop = {
      fromFx: this.fx, fromFy: this.fy,
      toFx: sp(land.x), toFy: sp(land.y),
      t: 0, n: LEDGE_HOP_FRAMES,
    };
    this.jumping = true;
    this.vz = 0;
    this.gliding = false;
    this.lockDir = true;
    this.dir = facing;
    game.audio.sfx('jump');
    return true;
  }

  /**
   * Carry the hop along its arc; `z` is set outright, not integrated.
   * The interpolation runs in subpixels and rounds once per frame, so the hop
   * lands on the exact tile it aimed at rather than a rounded-off neighbour.
   */
  updateLedgeHop(game) {
    const h = this.ledgeHop;
    h.t++;
    const u = Math.min(1, h.t / h.n);
    this.fx = h.fromFx + Math.round((h.toFx - h.fromFx) * u);
    this.fy = h.fromFy + Math.round((h.toFy - h.fromFy) * u);
    this.fz = Math.round(sp(LEDGE_HOP_HEIGHT) * Math.sin(u * Math.PI));
    if (u < 1) return;
    this.ledgeHop = null;
    this.fz = 0; this.vz = 0; this.jumping = false; this.lockDir = false;
    const f = groundFlags(game, this);
    if ((f & F.DEEP) && !this._flippers) { this.beginWash(game); return; }
    if (f & F.PIT) { this.beginFall(game); return; }
    game.audio.sfx('land');
    game.spawnEffect((f & F.WET) ? 'splash' : 'dust', this.x, this.y + 4, { life: 12 });
  }

  tileDefAt(game, tx, ty) {
    if (tx < 0 || ty < 0 || tx * TILE >= VIEW_W || ty * TILE >= VIEW_H) return null;
    return game.room.tile(tx, ty, game.tide.level);
  }

  tryPush(game, dx, dy) {
    this._pushT = (this._pushT || 0) + 1;
    if (this._pushT < PUSH_DELAY_FRAMES) return;
    const [ux, uy] = [Math.sign(dx), Math.sign(dy)];
    const tx = Math.floor((this.cx + ux * PUSH_PROBE_REACH) / TILE);
    const ty = Math.floor((this.cy + uy * PUSH_PROBE_REACH) / TILE);
    if (game.tryPushBlock(tx, ty, ux, uy)) this._pushT = 0;
  }

  // ----------------------------------------------------------------- sword

  /** Which button the sword is bound to, or null if it is not equipped. */
  swordSlot(game) {
    if (game.progress.equipB === 'sword') return 'b';
    if (game.progress.equipA === 'sword') return 'a';
    return null;
  }

  // ------------------------------------------------------------- sword hold
  //
  // In the Oracles the sword is three verbs, not one. Tapping swings. Holding
  // charges a spin. And holding ALSO keeps the blade extended in front of you
  // and lets you walk with it out: it damages what it touches, it clinks off
  // walls, and Link is drawn in a different pose the whole time.
  //
  // The engine had the first two. Without the third, the most-used button in
  // the game does a third less than it should — you cannot shave a bush by
  // walking through it, you cannot hold a corridor against something walking
  // into you, and the long hold reads as a dead wait for the spin rather than
  // as a stance you are already fighting in.
  //
  // The contact damage is not rate-limited here. It does not need to be: the
  // enemy's own invulnerability window after a hit is what spaces the hits out,
  // which is exactly how the source games space them.

  updateSwordHold(game) {
    const slot = this.swordSlot(game);
    const out = !!slot && hasItem(game.progress, 'sword') && game.input.down(slot)
      && this.swinging === 0 && this.spinning === 0
      && !this.inDeep && !this.carrying && !this.hookPulling
      && this.charge >= SWORD_HOLD_DELAY;
    if (!out) { this.holding = false; this.holdT = 0; return; }

    this.holding = true;
    this.holdT++;

    const box = this.swordBox();
    for (const e of game.entities) {
      if (!e.isEnemy || e.dead || e.dormant || e.hidden) continue;
      if (!rectOverlap(box, e.rect())) continue;
      e.hurt(game, SWORD_HOLD_DAMAGE, this.dir, KNOCK_HOLD);
    }
    // Walking a held blade through undergrowth cuts it, as it does in Seasons.
    game.checkTileAction(box, 'cut');
    this.checkSwordClink(game);
  }

  /** The blade tip scraping something solid: a clink, a spark, no damage. */
  checkSwordClink(game) {
    if (this.clinkCool > 0 || !game.room || !game.input.anyDir()) return;
    const [dx, dy] = DIR_VEC[this.dir];
    const tx = this.cx + dx * (SWORD_REACH + SWORD_GAP);
    const ty = this.cy + dy * (SWORD_REACH + SWORD_GAP);
    if (tx < 0 || ty < 0 || tx >= VIEW_W || ty >= VIEW_H) return;
    if (!game.room.solidAt(tx, ty, game.tide.level, { jumping: false, swim: false })) return;
    this.clinkCool = SWORD_CLINK_COOLDOWN;
    game.audio.sfx('block');
    game.spawnEffect('spark', tx - 8, ty - 8);
  }

  startSwing(game, level) {
    if (this.swinging > 0 || this.spinning > 0 || this.inDeep || this.carrying) return true;
    this.swinging = SWING_FRAMES;
    this.holding = false;
    this.holdT = 0;
    this.swordLevel = level;
    this.swingHit = new Set();
    game.audio.sfx(level >= 3 ? 'sword3' : (level >= 2 ? 'sword2' : 'sword1'));
    game.spawnEffect('slashD', this.x, this.y);   // replaced per-direction below
    return true;
  }

  updateSwing(game) {
    this.swinging--;
    const t = SWING_FRAMES - this.swinging;
    if (t < SWING_HIT_START || t > SWING_HIT_END) return;
    const box = this.swordBox();
    // enemies
    for (const e of game.entities) {
      if (!e.isEnemy || e.dead || this.swingHit.has(e.id)) continue;
      if (rectOverlap(box, e.rect())) {
        this.swingHit.add(e.id);
        e.hurt(game, swordDamage(this.swordLevel), this.dir, KNOCK_SWORD);
      }
    }
    // tiles (bushes, signs)
    game.checkTileAction(box, 'cut');
  }

  swordBox() {
    const [dx, dy] = DIR_VEC[this.dir];
    const reach = SWORD_REACH;
    const w = dx !== 0 ? reach : SWORD_SPAN;
    const h = dy !== 0 ? reach : SWORD_SPAN;
    return {
      x: this.cx - w / 2 + dx * (reach / 2 + SWORD_GAP),
      y: this.cy - h / 2 + dy * (reach / 2 + SWORD_GAP),
      w, h,
    };
  }

  startSpin(game) {
    if (this.inDeep) return;
    this.spinning = SPIN_FRAMES;
    this.spinHit = new Set();
    this.swinging = 0;
    this.holding = false;
    this.holdT = 0;
    game.audio.sfx('spin');
  }

  updateSpin(game) {
    this.spinning--;
    this.animT++;
    // Spin drifts you slightly in the facing direction.
    const [dx, dy] = DIR_VEC[this.dir];
    moveEntity(game, this, dx * SPIN_DRIFT_SPEED, dy * SPIN_DRIFT_SPEED);
    const box = { x: this.cx - SPIN_BOX / 2, y: this.cy - SPIN_BOX / 2, w: SPIN_BOX, h: SPIN_BOX };
    for (const e of game.entities) {
      if (!e.isEnemy || e.dead || this.spinHit.has(e.id)) continue;
      if (rectOverlap(box, e.rect())) {
        this.spinHit.add(e.id);
        e.hurt(game, swordDamage(this.swordLevel || 1) + 1, this.dir, KNOCK_SPIN);
      }
    }
    game.checkTileAction(box, 'cut');
  }

  // ------------------------------------------------------------------ jump

  startJump(game, power, gliding) {
    if (this.jumping || this.inDeep || this.z > 0) return true;
    this.jumping = true;
    this.vz = power;
    this.gliding = !!gliding;
    this.lockDir = false;
    game.audio.sfx('jump');
    return true;
  }

  updateJump(game) {
    // A ledge hop drives z along a scripted arc; the ballistic integrator here
    // would pull it straight back to the ground on the first frame.
    if (this.ledgeHop) return;
    if (!this.jumping) {
      if (this.fz > 0) { this.fz = Math.max(0, this.fz - LAND_SETTLE_RATE); }
      return;
    }
    // Height integrates on the same subpixel grid as x and y: `vz` is sp/f and
    // gravity is sp/f^2, so a jump arc is exactly reproducible.
    this.fz += this.vz;
    // Roc's Cape hangs in the air a moment longer.
    this.vz -= (this.gliding && this.vz < 0 && game.input.down(game.progress.equipB === 'feather' ? 'b' : 'a'))
      ? GLIDE_GRAVITY : JUMP_GRAVITY;
    if (this.fz <= 0) {
      this.fz = 0; this.vz = 0; this.jumping = false;
      const f = groundFlags(game, this);
      // Landing in water you can't swim in throws you back.
      if ((f & F.DEEP) && !this._flippers) { this.beginWash(game); return; }
      if (f & F.PIT) { this.beginFall(game); return; }
      game.audio.sfx('land');
      if (!(f & F.WET)) game.spawnEffect('dust', this.x, this.y + 4, { life: 12 });
      else game.spawnEffect('splash', this.x, this.y + 2);
    }
  }

  // ------------------------------------------------------------------ lift

  tryLift(game, level) {
    if (this.carrying) return true;
    const [dx, dy] = DIR_VEC[this.dir];
    const tx = Math.floor((this.cx + dx * LIFT_REACH) / TILE);
    const ty = Math.floor((this.cy + dy * LIFT_REACH) / TILE);
    // liftable entities first (bombs, pots placed as entities)
    for (const e of game.entities) {
      if (e.liftable && !e.dead && Math.hypot(e.cx - (this.cx + dx * LIFT_REACH), e.cy - (this.cy + dy * LIFT_REACH)) < LIFT_REACH) {
        this.carrying = e;
        e.carried = true;
        game.audio.sfx('lift');
        return true;
      }
    }
    const got = game.liftTile(tx, ty, level, this);
    if (got) { this.carrying = got; game.audio.sfx('lift'); return true; }
    game.audio.sfx('deny');
    return true;
  }

  throwCarried(game) {
    const c = this.carrying;
    if (!c) return false;
    this.carrying = null;
    c.carried = false;
    const [dx, dy] = DIR_VEC[this.dir];
    if (c instanceof ThrownObject || c.thrownVx !== undefined) {
      c.thrownVx = dx * THROW_SPEED; c.thrownVy = dy * THROW_SPEED;
      c.x = this.x + dx * 4; c.y = this.y + dy * 4;
      c.remove = false;
    } else {
      c.remove = true;
      game.addEntity(new ThrownObject(this.x + dx * 4, this.y + dy * 4, {
        sprite: c.sprite || 'rock16', pal: c.pal || 'stone',
        vx: dx * THROW_SPEED, vy: dy * THROW_SPEED, z: CARRY_HEIGHT, drops: c.dropTable || 'none',
      }));
    }
    game.audio.sfx('throw');
    return true;
  }

  dropCarried(game) {
    if (!this.carrying) return;
    const c = this.carrying;
    this.carrying = null;
    c.carried = false;
    c.remove = true;
    game.spawnEffect('splash', c.x, c.y);
  }

  // ------------------------------------------------------------------- dig

  startDig(game) {
    if (this.digging > 0 || this.inDeep) return true;
    const f = groundFlags(game, this);
    this.digging = DIG_FRAMES;
    if (f & (F.SLOW)) {
      game.audio.sfx('dig');
      const { tx, ty } = groundTile(game, this);
      game.digTile(tx, ty, this);
    } else {
      game.audio.sfx('deny');
    }
    return true;
  }

  // ---------------------------------------------------------------- conch

  playConch(game) {
    if (this.conchTime > 0) return true;
    const why = game.tide.blockedReason();
    if (why) {
      game.audio.sfx('deny');
      game.say(why === 'locked'
        ? 'The conch will not sound in here.'
        : (why === 'forced' ? 'Something holds the water fast.' : ''));
      return true;
    }
    this.conchTime = CONCH_FRAMES;
    this.frozen = CONCH_FRAMES;
    game.audio.sfx('conch');
    game.tide.cycle();
    game.onConchPlayed();
    return true;
  }

  // ---------------------------------------------------------------- damage

  updateContactDamage(game) {
    if (this.invuln > 0 || this.invincible) return;
    for (const e of game.entities) {
      if (!e.isEnemy || e.dead || e.harmless || e.dormant || e.hidden) continue;
      if (e.damage <= 0) continue;
      if (this.z > 6 && !e.flying) continue;      // jumped over it
      if (!this.overlaps(e)) continue;
      this.takeDamage(game, e.damage, e);
      break;
    }
  }

  /** Ring/shield modifiers applied here so every damage source respects them. */
  takeDamage(game, amount, source, o = {}) {
    if (this.invuln > 0 || this.invincible || this.falling > 0 || this.washing > 0) return false;
    const p = game.progress;

    // Shield blocks damage from the facing direction (projectiles and contact).
    if (this.shielding && source) {
      const dir = dirFromDelta(source.cx - this.cx, source.cy - this.cy);
      if (dir === this.dir) {
        const lv = itemLevel(p, 'shield');
        const blocks = source.isProjectile ? lv >= 1 : lv >= 2;
        if (blocks) {
          game.audio.sfx('block');
          game.spawnEffect('spark', this.cx - 8, this.cy - 8);
          if (source.isProjectile) source.remove = true;
          return false;
        }
      }
    }

    let dmg = amount;
    if (game.hasRing('armor')) dmg = Math.max(1, Math.round(dmg * 0.5));
    if (game.hasRing('redJoy')) dmg = Math.round(dmg * 2);

    p.hearts = Math.max(0, p.hearts - dmg);
    this.invuln = PLAYER_INVULN_FRAMES;
    this.flicker = PLAYER_FLICKER_FRAMES;
    this.hurtTime = PLAYER_HURT_FRAMES;
    if (!o.noKnockDir && source) {
      const dx = this.cx - source.cx, dy = this.cy - source.cy;
      const d = Math.hypot(dx, dy) || 1;
      this.knockX = Math.round(dx / d * PLAYER_KNOCK_SPEED);
      this.knockY = Math.round(dy / d * PLAYER_KNOCK_SPEED);
    } else {
      this.knockX = 0; this.knockY = 0;
    }
    this.charge = 0;
    this.holding = false; this.holdT = 0;
    if (this.carrying) this.dropCarried(game);
    game.audio.sfx('linkHurt');
    game.shake(SHAKE_SMALL, SHAKE_SMALL_FRAMES);
    if (p.hearts <= 0) game.onPlayerDied();
    return true;
  }

  // ------------------------------------------------------------ pits/water

  beginFall(game) {
    if (this.falling > 0) return;
    this.falling = FALL_FRAMES;
    this.jumping = false;
    this.ledgeHop = null;
    this.z = 0;
    game.audio.sfx('fall');
  }

  updateFalling(game) {
    this.falling--;
    if (this.falling === 0) {
      const safe = findSafeTile(game, this) || this.lastSafe;
      this.x = safe.x; this.y = safe.y;
      this.takeDamage(game, PIT_DAMAGE, null, { noKnockDir: true });
      this.invuln = PLAYER_RECOVER_INVULN_FRAMES;
    }
  }

  /** Swept back to shore by water you cannot swim in. */
  beginWash(game) {
    if (this.washing > 0) return;
    this.washing = WASH_FRAMES;
    this.jumping = false;
    this.ledgeHop = null;
    this.vz = 0;
    game.audio.sfx('splash');
    game.spawnEffect('splash', this.x, this.y);
  }

  updateWashing(game) {
    this.washing--;
    this.animT++;
    if (this.washing === 0) {
      const safe = findSafeTile(game, this) || this.lastSafe;
      this.x = safe.x; this.y = safe.y;
      this.z = 0;
      this.takeDamage(game, WASH_DAMAGE, null, { noKnockDir: true });
      this.invuln = PLAYER_RECOVER_INVULN_FRAMES;
      game.say('The tide swept you back!');
    }
  }

  /** Called after a tide change to make sure Link is not left in a wall. */
  reconcileWithTide(game) {
    if (canOccupy(game, this, this.x, this.y, this.caps)) {
      const f = groundFlags(game, this);
      if (!(f & F.DEEP) || this._flippers) return;
    }
    const safe = findSafeTile(game, this);
    if (safe) {
      this.x = safe.x; this.y = safe.y;
      game.spawnEffect('splash', this.x, this.y);
    } else {
      this.beginWash(game);
    }
  }

  // ------------------------------------------------------------------ draw

  spriteName(game) {
    const side = this.dir === 'left' || this.dir === 'right';
    this.flipX = this.dir === 'left';
    const key = side ? 'side' : this.dir;

    if (def.liftLevel && level < def.liftLevel) { this.say('It is too heavy.'); return null; }
    room.setTile(tx, ty, tr.to);
    if (tr.persist) this.persistTile(tx, ty, tr.to);
    const obj = new ThrownObject(tx * TILE, ty * TILE, {
      sprite: def.liftSprite || (name.startsWith('pot') ? 'o_pot' : 'rock16'),
      pal: def.pal, vx: 0, vy: 0, z: 13, drops: tr.drop || 'none',
    });
    obj.vz = 0;
    obj.carried = true;
    obj.update = function (game) {
      // While carried the object just follows Link; throwing restores normal flight.
      if (this.carried) { this.frame++; return; }
      ThrownObject.prototype.update.call(this, game);
    };
    this.addEntity(obj);
    return obj;
  }

  digTile(tx, ty, player) {
    const room = this.room;
    const name = room.baseName(tx, ty);
    const tr = transformFor(name, 'dig');
    this.spawnEffect('dust', tx * TILE, ty * TILE, { life: 14 });
    if (tr) {
      room.setTile(tx, ty, tr.to);
      if (tr.persist) this.persistTile(tx, ty, tr.to);
      if (tr.drop) this.rollDrop(tx * TILE, ty * TILE, tr.drop);
      this.roomEvent('dig', { tx, ty });
      return true;
    }
    // Buried secrets are declared per-room.
    const buried = (room.def.buried || []).find(b => b[0] === tx && b[1] === ty);
    if (buried) {
      const key = `${this.mapId}:${room.key}:dig:${tx},${ty}`;
      if (!this.progress.secrets[key]) {
        this.progress.secrets[key] = true;
        this.spawnPickup(tx * TILE, ty * TILE, buried[2], { grabDelay: 14 });
        this.audio.jingle('secret');
      }
      return true;
    }
    return false;
  }

  tryPushBlock(tx, ty, dx, dy) {
    for (const e of this.entities) {
      if (e instanceof PushBlock) {
        if (Math.floor(e.cx / TILE) === tx && Math.floor(e.cy / TILE) === ty) {
          return e.push(this, dx, dy);
        }
      }
    }
    return false;
  }

  /** A-button interaction with a tile: locked doors, readable fixtures. */
  tileInteract(tx, ty, player) {
    const room = this.room;
    if (!room.inBounds(tx, ty)) return false;
    const name = room.baseName(tx, ty);
    const def = resolveTile(name, this.tide.level);
    if (name === 'dDoorLocked') {
      if (useKey(this.progress, this.mapId)) {
        room.setTile(tx, ty, 'dDoorOpen');
        this.persistTile(tx, ty, 'dDoorOpen');
        this.audio.sfx('unlock');
        this.say('The lock falls away.');
      } else {
        this.audio.sfx('deny');
        this.say('It is locked. You need a Small Key.');
      }
      return true;
    }
    if (name === 'dDoorBoss') {
      if (this.progress.bossKeys[this.mapId]) {
        room.setTile(tx, ty, 'dDoorOpen');
        this.persistTile(tx, ty, 'dDoorOpen');
        this.audio.sfx('unlock');
      } else {
        this.audio.sfx('deny');
        this.say('A great lock seals this door.');
      }
      return true;
    }
    const readable = (room.def.readable || []).find(r => r[0] === tx && r[1] === ty);
    if (readable) { this.say(readable[2]); return true; }
    return false;
  }

  /** Step onto a warp tile (cave mouth, stairs, open door). */
  checkWarpTile() {
    if (this.transition || this.fadeDir || !this.player) return;
    const p = this.player;
    if (p.z > 2) return;
    const tx = Math.floor(p.cx / TILE), ty = Math.floor((p.y + 12) / TILE);
    const f = this.room.flagsAt(tx, ty, this.tide.level);
    // Arriving on a warp tile must not bounce straight back through it: stay
    // locked until the player has stepped off any warp tile.
    if (!(f & F.WARP)) { this._warpLock = false; return; }
    if (this._warpLock) return;
    const w = this.room.warpAt(tx, ty);
    if (!w) return;
    if (w.needFlag && !flag(this.progress, w.needFlag)) return;
    this._warpLock = true;
    this.audio.sfx(w.sfx || 'stairs');
    this.warpTo(w.to.map, w.to.floor || 0, w.to.rx, w.to.ry,
      { x: w.to.px != null ? w.to.px : p.x, y: w.to.py != null ? w.to.py : p.y },
      w.to.dir || p.dir, { banner: true });
  }

  // ---------------------------------------------------------------- puzzles

  roomEvent(name, data) {
    const room = this.room;
    if (!room) return;
    if (room.def.script && room.def.script.onEvent) room.def.script.onEvent(this, name, data);
    this.checkPuzzle();
  }

  onSwitchChanged(sw) { this.roomEvent('switch', sw); }
  onTorchLit(t) { this.roomEvent('torch', t); }
  onBlockLanded(b) { this.roomEvent('block', b); }
  onValveToggled(v) { this.room.invalidate(); this.roomEvent('valve', v); }

  onTideChanged(next, prev) {
    if (this.player) this.player.reconcileWithTide(this);
    if (this.room) this.room.invalidate();
    this.roomEvent('tide', { next, prev });
  }

  onConchPlayed() {
    this.spawnEffect('sparkle', this.player.x, this.player.y - 8, { life: 30 });
  }

  onEnemyDefeated(e) {
    this.progress.kills++;
    if (e.isBoss) {
      this.progress.beaten[this.mapId] = true;
      this.boss = null;
      this.onBossDefeated(e);
      return;
    }
    if (!this.entities.some(x => x.isEnemy && !x.dead && x !== e)) {
      this.room.cleared = true;
      this.roomEvent('cleared', null);
    }
  }

  onBossDefeated(e) {
    const d = this.map && this.map.dungeon;
    this.shake(SHAKE_LARGE, SHAKE_LARGE_FRAMES);
    this.audio.stop();
    // Boss death opens the way to the essence.
    const room = this.room;
    if (d && d.essence != null) {
      this.frameLater(BOSS_ESSENCE_DELAY_FRAMES, () => {
        this.audio.jingle('bossClear');
        spawnEntity(this, 'essence', 4, 3, { index: d.index });
      });
    }
    // The boss track was stopped, so nothing would resume once the jingle ends.
    this.frameLater(BOSS_MUSIC_RESUME_FRAMES, () => this.updateMusic());
    if (room.def.script && room.def.script.onEvent) room.def.script.onEvent(this, 'bossDead', e);
  }

  checkPuzzle() {
    const room = this.room;
    if (!room || !room.def.puzzle || room._puzzleDone) return;
    const pz = room.def.puzzle;
    if (pz.flag && flag(this.progress, pz.flag)) { room._puzzleDone = true; this.applyReward(pz.reward, true); return; }

    if (pz.switches != null) {
      const sws = this.entities.filter(e => e instanceof FloorSwitch);
      const need = pz.switches === 'all' ? sws.length : pz.switches;
      if (!sws.length || sws.filter(s => s.pressed).length < need) return;
    }
    if (pz.torches != null) {
      const ts = this.entities.filter(e => e instanceof Torch);
      const need = pz.torches === 'all' ? ts.length : pz.torches;
      if (!ts.length || ts.filter(t => t.lit).length < need) return;
    }
    if (pz.enemies) {
      if (this.entities.some(e => e.isEnemy && !e.dead)) return;
    }
    if (pz.tide != null && this.tide.level !== pz.tide) return;
    if (pz.blocks) {
      const bs = this.entities.filter(e => e instanceof PushBlock);
      const ok = pz.blocks.every(([tx, ty]) =>
        bs.some(b => Math.round(b.x / TILE) === tx && Math.round(b.y / TILE) === ty));
      if (!ok) return;
    }
    if (pz.condition && !pz.condition(this, room)) return;

    room._puzzleDone = true;
    if (pz.flag) setFlag(this.progress, pz.flag);
    this.applyReward(pz.reward, false);
    this.roomEvent('puzzle', pz);
  }

  applyReward(reward, silent) {
    if (!reward) return;
    const room = this.room;
    if (reward.openDoors) {
      for (const [tx, ty] of reward.openDoors) {
        room.setTile(tx, ty, 'dDoorOpen');
        this.persistTile(tx, ty, 'dDoorOpen');
      }
    }
    if (reward.tiles) {
      for (const [tx, ty, name] of reward.tiles) {
        room.setTile(tx, ty, name);
        this.persistTile(tx, ty, name);
      }
    }
    if (reward.spawn) {
      for (const s of reward.spawn) spawnEntity(this, s[0], s[1], s[2], s[3] || {});
    }
    if (!silent) {
      // A reward that changes the room — a door opened, a tile swapped, a prize
      // released — is the discovery moment `secret` was written for. A reward
      // that only talks keeps the short sfx, and one that names its own wins.
      const opened = (reward.openDoors && reward.openDoors.length)
        || (reward.tiles && reward.tiles.length)
        || (reward.spawn && reward.spawn.length);
      if (reward.sfx) this.audio.sfx(reward.sfx);
      else if (opened) this.audio.jingle('secret');
      else this.audio.sfx('puzzle');
      if (reward.say) this.say(reward.say);
    }
  }

  // ------------------------------------------------------------- item grants

  openChest(chest) {
    const p = this.progress;
    if (chest.item) {
      const id = chest.item, lv = chest.level || 1;
      giveItem(p, id, lv);
      this.autoEquip(id);
      if (id === 'bombs') { p.maxBombs = Math.max(p.maxBombs, 10); addBombs(p, 10); }
      if (id === 'satchel') { p.maxSeeds = Math.max(p.maxSeeds, 20); addSeeds(p, 'ember', 20); p.seedSelected = 'ember'; }
      this.presentItem(id, lv);
    } else if (chest.pickup) {
      this.spawnPickup(chest.x, chest.y - 12, chest.pickup, { grabDelay: 10 });
    } else if (chest.rupees) {
      addRupees(p, chest.rupees);
      this.audio.sfx('rupeeBig');
      this.say(`You got ${chest.rupees} Rupees!`);
    } else {
      this.say('Nothing but sand.');
    }
  }

  /** Freeze, hold the item overhead, and describe it. */
  presentItem(id, lv) {
    const def = ITEMS[id];
    // `itemGet` is the rising arpeggio composed for exactly this beat — the
    // item held overhead. `fanfare` is the longer piece, kept for the moments
    // that earn it (heart container, essence, dungeon cleared).
    this.audio.jingle('itemGet');
    this.player.frozen = ITEM_PRESENT_FRAMES;
    this.itemShow = { id, lv, t: ITEM_PRESENT_FRAMES };
    const name = itemName(id, lv);
    this.say(`You got the ${name}!\n${def ? def.desc : ''}`);
  }

  autoEquip(id) {
    const p = this.progress;
    const def = ITEMS[id];
    if (!def || !def.equippable) return;
    if (!p.equipB) p.equipB = id;
    else if (!p.equipA) p.equipA = id;
  }

  claimEssence(index) {
    const p = this.progress;
    if (!p.essences.includes(index)) p.essences.push(index);
    p.essences.sort((a, b) => a - b);
    this.audio.jingle('essence');
    this.player.frozen = ESSENCE_FREEZE_FRAMES;
    this.startCutscene('essence' + index, { fallback: 'essenceGeneric', data: { index } });
  }

  spawnPickup(x, y, kind, o = {}) {
    const e = new Pickup(x, y, { kind, ...o });
    this.addEntity(e);
    return e;
  }

  rollDrop(x, y, table) {
    const kind = rollDropTable(table, this.rng);
    if (!kind) return null;
    return this.spawnPickup(x, y, kind);
  }

  // -------------------------------------------------------------- utilities

  addEntity(e) { this.pendingAdd.push(e); return e; }
  flushPending() {
    if (!this.pendingAdd.length) return;
    for (const e of this.pendingAdd) this.entities.push(e);
    this.pendingAdd.length = 0;
  }

  spawnEffect(name, x, y, opts) { return spawnEffectAt(this, name, x, y, opts); }

  shake(amp, frames) { this.shakeAmp = Math.max(this.shakeAmp, amp); this.shakeTime = Math.max(this.shakeTime, frames); }

  say(text, opts) { if (text) this.dialogue.show(text, opts); }

  /** Show a named dialogue script. Falls back to the id so gaps are visible. */
  startDialogue(id, npc) {
    const t = getText(id);
    if (t == null) { console.warn('[dialogue] missing text:', id); this.say('...'); return; }
    this.say(typeof t === 'function' ? t(this, npc) : t);
  }

  ask(text, options, onPick) { this.dialogue.show(text, { choices: options, onPick }); }

  hasRing(id) {
    const p = this.progress;
    return p.ringsEquipped.includes(id);
  }

  /** Run a callback after n frames (used for beats in scripted moments). */
  frameLater(n, fn) {
    (this._timers = this._timers || []).push({ n, fn });
  }

  updateTimers() {
    if (!this._timers || !this._timers.length) return;
    for (const t of this._timers) t.n--;
    const due = this._timers.filter(t => t.n <= 0);
    this._timers = this._timers.filter(t => t.n > 0);
    for (const t of due) t.fn();
  }

  updateMusic() {
    const want = this.room && this.room.music ? this.room.music
      : (this.map && this.map.music) || 'overworld';
    const track = this.boss ? (this.map.dungeon && this.map.dungeon.bossMusic || 'boss') : want;
    if (track) this.audio.play(track);
  }

  startCutscene(id, o = {}) {
    const cs = CUTSCENES[id] || (o.fallback ? CUTSCENES[o.fallback] : null);
    if (!cs) return false;
    this.cutscene = runCutscene(this, cs, o.data || {});
    this.mode = 'cutscene';
    return true;
  }

  startGaleWarp() {
    const spots = [{ name: 'Tidewatch Village', map: 'overworld', floor: 0, rx: 4, ry: 7, px: 72, py: 64 }];
    for (const m of MAPS.values()) {
      if (m.kind === 'dungeon' && m.dungeon && m.dungeon.entrance
        && this.progress.secrets['seen:' + m.id + ':' + '0,' + m.dungeon.startRoom]) {
        spots.push({ name: m.name, ...m.dungeon.entrance });
      }
    }
    if (spots.length === 1) {
      this.warpTo(spots[0].map, spots[0].floor, spots[0].rx, spots[0].ry, { x: spots[0].px, y: spots[0].py }, 'down', { banner: true });
      return;
    }
    this.ask('Where shall the wind take you?', spots.map(s => s.name), (i) => {
      const s = spots[i];
      this.warpTo(s.map, s.floor, s.rx, s.ry, { x: s.px, y: s.py }, 'down', { banner: true });
    });
  }

  enterWhirlpool(p) {
    if (this._whirl) return;
    this._whirl = true;
    const dest = (this.room.def.whirlpool) || null;
    this.audio.sfx('whirl');
    this.fadeOut(() => {
      this._whirl = false;
      if (dest) this.enterMap(dest.map, dest.floor || 0, dest.rx, dest.ry, dest.px, dest.py, 'down', { banner: true });
      else { const s = this.progress.respawn; this.enterMap(s.map, s.floor, s.rx, s.ry, s.px, s.py, s.dir); }
    });
  }

  onPlayerDied() {
    if (this.mode === 'gameover') return;
    this.mode = 'gameover';
    this.deathTime = 0;
    this.progress.deaths++;
    this.audio.stop();
    this.audio.jingle('gameOver');
  }

  respawn(keepProgress = true) {
    const p = this.progress;
    p.hearts = p.maxHearts;
    const s = p.respawn;
    this.mode = 'play';
    this.entities.length = 0;
    this.player = new Player(s.px, s.py);
    this.player.dir = s.dir || 'down';
    this.tide.setLevel(1, { instant: true });
    this.enterMap(s.map, s.floor, s.rx, s.ry, s.px, s.py, s.dir, { instant: true });
    this.fadeIn();
  }

  // ------------------------------------------------------------------ frame

  update() {
    this.frame++;
    this.input.update();
    this.audio.update();
    this.progress.frames++;
    this.updateTimers();
    this.updateFade();
    if (this.shakeTime > 0) { this.shakeTime--; if (this.shakeTime === 0) this.shakeAmp = 0; }

    const extra = this.input.takeExtra();
    if (extra === 'KeyP') { this.audio.toggleMute(); }
    if (extra === 'KeyO') { this.debug = !this.debug; }

    switch (this.mode) {
      case 'title': this.title.update(); return;
      case 'cutscene':
        this.dialogue.update();
        if (this.cutscene) {
          const done = this.cutscene.update();
          if (done) { this.cutscene = null; this.mode = 'play'; this.updateMusic(); }
        } else this.mode = 'play';
        return;
      case 'menu': this.menu.update(); return;
      case 'gameover': this.updateGameOver(); return;
    }

    // --- play mode ---
    this.tide.update();
    if (this.bannerTime > 0) this.bannerTime--;
    if (this.itemShow) { this.itemShow.t--; if (this.itemShow.t <= 0) this.itemShow = null; }
    if (this.lure) { if (--this.lure.life <= 0) this.lure = null; }

    if (this.dialogue.active) { this.dialogue.update(); this.flushPending(); return; }

    if (this.input.pressed('start')) {
      this.menu.open();
      this.audio.sfx('pause');
      return;
    }

    if (this.transition) { this.updateTransition(); this.flushPending(); return; }
    if (this.tide.busy) { this.tide.update(); return; }
    if (this.fadeDir) return;

    if (this.player) this.player.update(this);
    for (const e of this.entities) {
      if (e === this.player || e.remove) continue;
      if (e.update) e.update(this);
    }
    this.flushPending();
    this.entities = this.entities.filter(e => !e.remove);

    this.checkRoomExit();
    this.checkWarpTile();
    this.checkPuzzle();
  }

  updateGameOver() {
    this.deathTime++;
    if (this.deathTime < GAMEOVER_WAIT_FRAMES) return;
    if (this.input.pressed('a') || this.input.pressed('start')) {
      if (this.deathChoice === undefined) this.deathChoice = 0;
      this.respawn();
      this.deathChoice = undefined;
    }
  }

  // ------------------------------------------------------------------- draw

  draw() {
    const ctx = this.ctx;
    if (this.mode === 'title') { this.title.draw(ctx); return; }

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    let ox = 0, oy = HUD_H;
    if (this.shakeTime > 0) {
      // draw() runs at display rate, not at the fixed 60 Hz step, so this must
      // not touch a stream — a slow machine would draw a different number of
      // times per update and silently advance the run's randomness. noise1 is
      // a pure hash of the frame counter: same shake, no state consumed.
      ox += Math.round(noise1(this.frame * 2) * this.shakeAmp);
      oy += Math.round(noise1(this.frame * 2 + 1) * this.shakeAmp);
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HUD_H, VIEW_W, VIEW_H);
    ctx.clip();

    if (this.transition) this.drawTransition(ctx, ox, oy);
    else this.drawScene(ctx, ox, oy);

    ctx.restore();

    drawHud(ctx, this);
    drawAreaBanner(ctx, this);
    if (this.boss && !this.boss.dead) drawBossBar(ctx, this);
    this.dialogue.draw(ctx);

    if (this.mode === 'menu') this.menu.draw(ctx);
    if (this.mode === 'cutscene' && this.cutscene) this.cutscene.draw(ctx);
    if (this.mode === 'gameover') this.drawGameOver(ctx);

    if (this.fadeAmount > 0) this.screen.fade(this.fadeAmount, this.fadeWhite);
    if (this.debug) this.drawDebug(ctx);
  }

  drawScene(ctx, ox, oy) {
    const room = this.room;
    if (!room) return;
    const base = room.render(this.tide.level, this.frame);

    if (this.tide.busy) {
      this.tide.drawSweep(ctx, ox, oy, base, () => {
        room.drawAnim(ctx, ox, oy, this.tide.level, this.frame);
        room.drawOver(ctx, ox, oy, this.tide.level, this.frame);
      });
      // Link keeps standing there while the water changes around him.
      if (this.player) this.player.draw(ctx, this, ox, oy);
      return;
    }

    ctx.drawImage(base, ox, oy);
    room.drawAnim(ctx, ox, oy, this.tide.level, this.frame);

    const list = this.entities.slice();
    if (this.player && !list.includes(this.player)) list.push(this.player);
    list.sort((a, b) => (a.depth * 1000 + a.y + a.h) - (b.depth * 1000 + b.y + b.h));
    for (const e of list) { if (e.drawShadow) e.drawShadow(ctx, this, ox, oy); }
    for (const e of list) {
      if (e.hidden) continue;
      e.draw(ctx, this, ox, oy);
    }

    room.drawOver(ctx, ox, oy, this.tide.level, this.frame);

    if (room.dark && !flag(this.progress, 'lantern')) this.drawDarkness(ctx, ox, oy);
    if (this.itemShow) this.drawItemShow(ctx);
  }

  drawTransition(ctx, ox, oy) {
    const t = this.transition;
    const k = t.t / ROOM_TRANSITION_FRAMES;
    const d = { right: [-1, 0], left: [1, 0], down: [0, -1], up: [0, 1] }[t.dir];
    const sx = Math.round(d[0] * VIEW_W * k), sy = Math.round(d[1] * VIEW_H * k);
    ctx.drawImage(this.roomSnapshot.canvas, ox + sx, oy + sy);
    const nb = t.to.render(this.tide.level, this.frame);
    const nx = ox + sx - d[0] * VIEW_W, ny = oy + sy - d[1] * VIEW_H;
    ctx.drawImage(nb, nx, ny);
    t.to.drawAnim(ctx, nx, ny, this.tide.level, this.frame);
    t.to.drawOver(ctx, nx, ny, this.tide.level, this.frame);
    if (this.player) this.player.draw(ctx, this, ox + sx, oy + sy);
  }

  drawDarkness(ctx, ox, oy) {
    const p = this.player;
    const cx = ox + (p ? p.cx : VIEW_W / 2), cy = oy + (p ? p.cy : VIEW_H / 2);
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 54);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.7, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0.88)');
    ctx.fillStyle = g;
    ctx.fillRect(0, HUD_H, VIEW_W, VIEW_H);
  }

  drawItemShow(ctx) {
    const p = this.player;
    if (!p) return;
    const s = this.itemShow;
    sprites.draw(ctx, itemIcon(s.id, s.lv), p.x, HUD_H + p.y - 16,
      { pal: ITEMS[s.id] && ITEMS[s.id].pal });
  }

  drawGameOver(ctx) {
    const t = Math.min(1, this.deathTime / 60);
    this.screen.fade(t * 0.85);
    if (this.deathTime > 60) {
      drawTextCentered(ctx, 'YOU DIED', SCREEN_W / 2, 56, '#e04858');
      if (this.deathTime > GAMEOVER_WAIT_FRAMES && (this.frame >> 4) % 2 === 0) {

// Terrain extracted from assets/sheets/ wins over the hand-drawn tile of the
// same name — ART-DIRECTION.md's rule 1, "if a sheet has it, extract it". Only
// the pixels are replaced; every tile keeps the palette its definition below
// binds, so the palette-swap variants and the region colour schemes are
// untouched. Regenerate with `python3 tools/rip-terrain.py`.
const ART = { ...HAND_ART, ...TERRAIN_ART };

function installCoreTiles() {
  tileSheet.add(ART, 'stone');
  // Animation frames are art without being tiles in their own right.
  declareAnimArt(Object.keys(ART));

  const TILE_DEFS = {
    void: { art: ART.void, pal: 'abyss', flags: F.VOID | F.SOLID },

    // --- walkable ground ---
    grass: { art: ART.grass, pal: 'grass' },
    grassTuft: { art: ART.grassTuft, pal: 'grass' },
    grassDark: { art: ART.grass, pal: 'grassdk' },
    // The extracted `flowers` is a transparent prop rather than a filled ground
    // tile, so it needs a base drawn under it like `bush` and `rock` do. Still
    // walkable, and still cuts down to plain grass (see TRANSFORMS below).
    flowers: { art: ART.flowers, pal: 'grass', underArt: 'grass' },
    flowersDark: { art: ART.flowers, pal: 'grassdk', underArt: 'grassDark' },
    tallgrass: { art: ART.tallgrass, pal: 'grassdk', flags: F.TALLGRASS },
    sand: { art: ART.sand, pal: 'sand' },
    sandWet: { art: ART.sandWet, pal: 'sandwet' },
    sandRipple: { art: ART.sandRipple, pal: 'sand' },
    sandDeep: { art: ART.sand, pal: 'sandwet', flags: F.SLOW },
    mud: { art: ART.mud, pal: 'bog', flags: F.SLOW },
    rockFloor: { art: ART.rockFloor, pal: 'stone' },
    rockFloorDk: { art: ART.rockFloor, pal: 'stonedk' },
    // Regional palette variants. Same art, different colours — this is how the
    // GBC games gave each region its own look without redrawing every tile.
    rockFloorRust: { art: ART.rockFloor, pal: 'rust' },
    rockFloorCoral: { art: ART.rockFloor, pal: 'coral' },
    grassBog: { art: ART.grass, pal: 'bog' },
    grassTuftBog: { art: ART.grassTuft, pal: 'bog' },
    saltFlat: { art: ART.sandRipple, pal: 'marble' },
    saltCrust: { art: ART.sand, pal: 'marble' },
    iceFloor: { art: ART.sandRipple, pal: 'ice', flags: F.ICE },
    sandCoral: { art: ART.sand, pal: 'coral' },
    sandRust: { art: ART.sand, pal: 'rust' },

    // --- water (concrete) ---
    waterS: { art: ART.waterS0, pal: 'water', flags: F.WATER, anim: ['waterS0', 'waterS1', 'waterS2', 'waterS1'], animRate: 11 },
    waterD: { art: ART.waterD0, pal: 'deep', flags: F.DEEP, anim: ['waterD0', 'waterD1', 'waterD2', 'waterD1'], animRate: 13 },
    waterSReef: { art: ART.waterS0, pal: 'reef', flags: F.WATER, anim: ['waterS0', 'waterS1', 'waterS2', 'waterS1'], animRate: 11 },
    waterDReef: { art: ART.waterD0, pal: 'reef', flags: F.DEEP, anim: ['waterD0', 'waterD1', 'waterD2', 'waterD1'], animRate: 13 },
    waterAbyss: { art: ART.waterD0, pal: 'abyss', flags: F.DEEP, anim: ['waterD0', 'waterD1', 'waterD2', 'waterD1'], animRate: 16 },
    foamN: { art: ART.foamN, pal: 'water', flags: F.WATER },

    // --- TIDE TILES: the heart of the game -------------------------------
    // A tide tile resolves to a different concrete tile per tide level.
    // low (0)            mid (1)            high (2)
    sandbar: { tide: ['sand', 'waterS', 'waterD'] },              // beach that drowns
    tidePool: { tide: ['sandWet', 'waterS', 'waterD'] },
    shoal: { tide: ['sandRipple', 'sandWet', 'waterS'] },         // only floods at high
    seafloor: { tide: ['sandWet', 'waterD', 'waterD'] },          // exposed only at low
    channel: { tide: ['waterS', 'waterD', 'waterD'] },            // wadeable only at low
    reefFlat: { tide: ['rockFloor', 'waterSReef', 'waterDReef'] },
    reefDeep: { tide: ['waterSReef', 'waterDReef', 'waterDReef'] },
    tideRock: { tide: ['rockFloor', 'rockFloor', 'waterS'] },     // stepping stone
    drownWall: { tide: ['cliff', 'cliff', 'waterD'] },            // swim over it at high
    tideGrass: { tide: ['grass', 'grass', 'waterS'] },
    mudflat: { tide: ['mud', 'waterS', 'waterD'] },
    abyssHole: { tide: ['waterD', 'waterAbyss', 'waterAbyss'] },

    // --- barriers ---
    cliff: { art: ART.cliff, pal: 'stone', flags: F.SOLID },
    cliffTop: { art: ART.cliffTop, pal: 'stone', flags: F.SOLID },
    cliffDk: { art: ART.cliff, pal: 'stonedk', flags: F.SOLID },
    cliffSand: { art: ART.cliff, pal: 'sand', flags: F.SOLID },
    cliffRust: { art: ART.cliff, pal: 'rust', flags: F.SOLID },
    cliffCoral: { art: ART.cliff, pal: 'coral', flags: F.SOLID },
    cliffMarble: { art: ART.cliff, pal: 'marble', flags: F.SOLID },
    cliffAbyss: { art: ART.cliff, pal: 'abyss', flags: F.SOLID },
    // Outdoor bombable walls. dWallCracked is the indoor equivalent; these let
    // an overworld region be gated on Bombs, which GAME-PLAN.md asks for and
    // nothing outdoors could express before.
    cliffCracked: { art: ART.cliffCracked, pal: 'stone', flags: F.SOLID | F.BOMBABLE },
    // The two region gates GAME-PLAN.md asks for. The Marsh gate proved the
    // shape — a solid tile with a flag, plus a transform naming what opens it —
    // and these two only add `level`, so the gate can name the MAGIC boomerang
    // rather than any boomerang.
    saltVane: { art: ART.saltVane, pal: 'marble', flags: F.SOLID | F.VANE, underArt: 'saltFlat' },
    abyssPlug: { art: ART.abyssPlug, pal: 'rust', flags: F.SOLID | F.MAGNETIC, underArt: 'rockFloorDk' },

    // ---- the four terrain-shaped region gates ------------------------------
    // Each carries TWO flags: the ordinary one that tells the engine what the
    // tile physically is, and a marker naming the item that gets you past it.
    // The engine already knows how to cross all of these — `Room.solidAt` lets
    // a jumping player through JUMPABLE and a swimming one through DEEP — so
    // none of this needed an engine change. The marker is purely so a checker
    // can tell "gated on the Hookshot" from "unreachable".
    //
    // WIDTH IS PART OF THE GATE for three of them, and no flag can express it:
    // a jumping player crosses DEEP as well as JUMPABLE, so a one-tile channel
    // is not a Flippers gate, and a one-tile chasm is not a Hookshot gate.
    // `tools/check-gates.mjs` measures the reach in-engine rather than trusting
    // this comment; the widths it proved are recorded there.
    chasm: {
      art: ART.dPit, pal: 'abyss', flags: F.JUMPABLE | F.GAP,
    },
    boulder: {
      art: ART.boulder, pal: 'stonedk', flags: F.SOLID | F.ROCK | F.HEAVY,
      underArt: 'rockFloor', liftLevel: 1,
    },
    cliffCrackedDk: { art: ART.cliffCracked, pal: 'stonedk', flags: F.SOLID | F.BOMBABLE },
    treeDead: { art: ART.tree, pal: 'treedead', flags: F.SOLID, underArt: 'grassBog' },
    treeDark: { art: ART.tree, pal: 'treedk', flags: F.SOLID, underArt: 'grassDark' },
    tree: { art: ART.tree, pal: 'tree', flags: F.SOLID, underArt: 'grass' },
    treeSand: { art: ART.tree, pal: 'tree', flags: F.SOLID, underArt: 'sand' },
    palm: { art: ART.palmTree, pal: 'tree', flags: F.SOLID, underArt: 'sand' },
    bush: { art: ART.bush, pal: 'tree', flags: F.SOLID | F.BUSH, underArt: 'grass' },
    bushSand: { art: ART.bush, pal: 'tree', flags: F.SOLID | F.BUSH, underArt: 'sand' },
    rock: { art: ART.rock, pal: 'stone', flags: F.SOLID | F.ROCK, underArt: 'grass' },
    rockSand: { art: ART.rock, pal: 'sand', flags: F.SOLID | F.ROCK, underArt: 'sand' },
    pot: { art: ART.pot, pal: 'pot', flags: F.SOLID | F.ROCK, underArt: 'dFloor' },
    sign: { art: ART.sign, pal: 'wood', flags: F.SOLID, underArt: 'grass' },
    stump: { art: ART.stump, pal: 'wood', flags: F.SOLID, underArt: 'grass' },
    spikes: { art: ART.spikes, pal: 'stone', flags: F.HAZARD, underArt: 'dFloor' },

    // --- transitions ---
    caveMouth: { art: ART.caveMouth, pal: 'stonedk', flags: F.SOLID | F.WARP, mask: 0 },
    caveMouthSolid: { art: ART.caveMouth, pal: 'stonedk', flags: F.SOLID },
    stairsDown: { art: ART.stairsDown, pal: 'stone', flags: F.WARP | F.STAIRS },
    // One-way ledges. The art is one tile; what changes per region is the
    // palette and the ground drawn under its transparent top and foot, the same
    // palette-swap trick every cliff variant uses. Without these a ledge in the
    // dunes was a green lip on yellow sand, and the dungeons had no ledge
    // character in their legend at all.
    //
    // Every variant takes its region's CLIFF palette, not its ground palette.
    // A ledge is the lip of a short cliff — exposed rock, not grass seen edge
    // on — and that is also the only choice that guarantees contrast: the first
    // pass gave the Drowned Wood's ledge the region's own `grassdk`, and the
    // drop vanished into the grass it was cut out of.
    ledgeS: { art: ART.ledgeS, pal: 'stone', flags: F.LEDGE, ledge: 'down', underArt: 'grass' },
    ledgeDk: { art: ART.ledgeS, pal: 'stonedk', flags: F.LEDGE, ledge: 'down', underArt: 'grassDark' },
    ledgeSand: { art: ART.ledgeS, pal: 'sand', flags: F.LEDGE, ledge: 'down', underArt: 'sand' },
    ledgeRock: { art: ART.ledgeS, pal: 'stonedk', flags: F.LEDGE, ledge: 'down', underArt: 'rockFloor' },
    ledgeRockDk: { art: ART.ledgeS, pal: 'stonedk', flags: F.LEDGE, ledge: 'down', underArt: 'rockFloorDk' },
    ledgeSalt: { art: ART.ledgeS, pal: 'marble', flags: F.LEDGE, ledge: 'down', underArt: 'saltFlat' },
    ledgeCoral: { art: ART.ledgeS, pal: 'coral', flags: F.LEDGE, ledge: 'down', underArt: 'rockFloorCoral' },
    ledgeAbyss: { art: ART.ledgeS, pal: 'abyss', flags: F.LEDGE, ledge: 'down', underArt: 'rockFloorDk' },
    // Indoors the lip wants contrast against the tan flagstone, so it takes the
    // wall's palette rather than the floor's narrow `stonef` ramp — three
    // near-identical greys would lose the lit top edge entirely.
    dLedge: { art: ART.ledgeS, pal: 'stonedk', flags: F.LEDGE, ledge: 'down', underArt: 'dFloor' },

    // The same nine families facing the other three cardinals. Each keeps its
    // family's palette and `underArt` exactly — only the art and the `ledge`
    // direction change — so a north drop in the dunes is the same rock as the
    // south drop beside it rather than a second, subtly different cliff.
    ledgeN: { art: ART.ledgeN, pal: 'stone', flags: F.LEDGE, ledge: 'up', underArt: 'grass' },
    ledgeE: { art: ART.ledgeE, pal: 'stone', flags: F.LEDGE, ledge: 'right', underArt: 'grass' },
    ledgeW: { art: ART.ledgeW, pal: 'stone', flags: F.LEDGE, ledge: 'left', underArt: 'grass' },

    ledgeDkN: { art: ART.ledgeN, pal: 'stonedk', flags: F.LEDGE, ledge: 'up', underArt: 'grassDark' },
    ledgeDkE: { art: ART.ledgeE, pal: 'stonedk', flags: F.LEDGE, ledge: 'right', underArt: 'grassDark' },
    ledgeDkW: { art: ART.ledgeW, pal: 'stonedk', flags: F.LEDGE, ledge: 'left', underArt: 'grassDark' },

    ledgeSandN: { art: ART.ledgeN, pal: 'sand', flags: F.LEDGE, ledge: 'up', underArt: 'sand' },
    ledgeSandE: { art: ART.ledgeE, pal: 'sand', flags: F.LEDGE, ledge: 'right', underArt: 'sand' },
    ledgeSandW: { art: ART.ledgeW, pal: 'sand', flags: F.LEDGE, ledge: 'left', underArt: 'sand' },

    ledgeRockN: { art: ART.ledgeN, pal: 'stonedk', flags: F.LEDGE, ledge: 'up', underArt: 'rockFloor' },
    ledgeRockE: { art: ART.ledgeE, pal: 'stonedk', flags: F.LEDGE, ledge: 'right', underArt: 'rockFloor' },
    ledgeRockW: { art: ART.ledgeW, pal: 'stonedk', flags: F.LEDGE, ledge: 'left', underArt: 'rockFloor' },

    ledgeRockDkN: { art: ART.ledgeN, pal: 'stonedk', flags: F.LEDGE, ledge: 'up', underArt: 'rockFloorDk' },
    ledgeRockDkE: { art: ART.ledgeE, pal: 'stonedk', flags: F.LEDGE, ledge: 'right', underArt: 'rockFloorDk' },
    ledgeRockDkW: { art: ART.ledgeW, pal: 'stonedk', flags: F.LEDGE, ledge: 'left', underArt: 'rockFloorDk' },

    ledgeSaltN: { art: ART.ledgeN, pal: 'marble', flags: F.LEDGE, ledge: 'up', underArt: 'saltFlat' },
    ledgeSaltE: { art: ART.ledgeE, pal: 'marble', flags: F.LEDGE, ledge: 'right', underArt: 'saltFlat' },
    ledgeSaltW: { art: ART.ledgeW, pal: 'marble', flags: F.LEDGE, ledge: 'left', underArt: 'saltFlat' },

    ledgeCoralN: { art: ART.ledgeN, pal: 'coral', flags: F.LEDGE, ledge: 'up', underArt: 'rockFloorCoral' },
    ledgeCoralE: { art: ART.ledgeE, pal: 'coral', flags: F.LEDGE, ledge: 'right', underArt: 'rockFloorCoral' },
    ledgeCoralW: { art: ART.ledgeW, pal: 'coral', flags: F.LEDGE, ledge: 'left', underArt: 'rockFloorCoral' },

    ledgeAbyssN: { art: ART.ledgeN, pal: 'abyss', flags: F.LEDGE, ledge: 'up', underArt: 'rockFloorDk' },
    ledgeAbyssE: { art: ART.ledgeE, pal: 'abyss', flags: F.LEDGE, ledge: 'right', underArt: 'rockFloorDk' },
    ledgeAbyssW: { art: ART.ledgeW, pal: 'abyss', flags: F.LEDGE, ledge: 'left', underArt: 'rockFloorDk' },

    dLedgeN: { art: ART.ledgeN, pal: 'stonedk', flags: F.LEDGE, ledge: 'up', underArt: 'dFloor' },
    dLedgeE: { art: ART.ledgeE, pal: 'stonedk', flags: F.LEDGE, ledge: 'right', underArt: 'dFloor' },
    dLedgeW: { art: ART.ledgeW, pal: 'stonedk', flags: F.LEDGE, ledge: 'left', underArt: 'dFloor' },

    // --- dungeon ---
    dFloor: { art: ART.dFloor, pal: 'brickf' },
    dFloorCrack: { art: ART.dFloorCrack, pal: 'brick' },
    dFloorWet: { art: ART.dFloor, pal: 'stonef' },
    dWall: { art: ART.dWall, pal: 'stonedk', flags: F.SOLID },
    dWallCracked: { art: ART.dWallCracked, pal: 'stonedk', flags: F.SOLID | F.BOMBABLE },
    dPit: { art: ART.dPit, pal: 'abyss', flags: F.PIT },
    dDoorClosed: { art: ART.dDoorClosed, pal: 'stonedk', flags: F.SOLID | F.DOOR },
    dDoorOpen: { art: ART.dDoorOpen, pal: 'stonedk', flags: F.WARP | F.DOOR },
    dDoorLocked: { art: ART.dDoorLocked, pal: 'gold', flags: F.SOLID | F.DOOR },
    dDoorBoss: { art: ART.dDoorBoss, pal: 'gold', flags: F.SOLID | F.DOOR },
    dStairs: { art: ART.dStairs, pal: 'stonedk', flags: F.WARP | F.STAIRS },
    dPost: { art: ART.dPost, pal: 'stone', flags: F.SOLID | F.HOOKABLE, underArt: 'dFloor' },
    post: { art: ART.dPost, pal: 'wood', flags: F.SOLID | F.HOOKABLE, underArt: 'grass' },
    postSand: { art: ART.dPost, pal: 'wood', flags: F.SOLID | F.HOOKABLE, underArt: 'sand' },
    digSpot: { art: ART.digSpot, pal: 'sand', flags: F.SLOW },
    dSwitchUp: { art: ART.dSwitchUp, pal: 'brick', flags: F.SWITCHF },
    dSwitchDown: { art: ART.dSwitchDown, pal: 'brick' },
    dBlock: { art: ART.dBlock, pal: 'stone', flags: F.SOLID },
    dWaterS: { art: ART.waterS0, pal: 'water', flags: F.WATER, anim: ['waterS0', 'waterS1', 'waterS2', 'waterS1'], animRate: 11 },
    dWaterD: { art: ART.waterD0, pal: 'deep', flags: F.DEEP, anim: ['waterD0', 'waterD1', 'waterD2', 'waterD1'], animRate: 13 },

    // Dungeon tide tiles: the same three-state trick indoors.
    dSluice: { tide: ['dFloorWet', 'dWaterS', 'dWaterD'] },
    dBasin: { tide: ['dFloor', 'dFloorWet', 'dWaterS'] },
    dWell: { tide: ['dWaterS', 'dWaterD', 'dWaterD'] },
    dDrain: { tide: ['dPit', 'dWaterS', 'dWaterD'] },
  };
  registerTiles(TILE_DEFS);

  // Rooms draw a tile by its *tile* name, but the art above is keyed by art
  // name — so every palette-swap tile (grassDark reusing ART.grass, treeDark
  // reusing ART.tree, and the rest) had no entry to find and rendered as a
  // placeholder box. Alias each tile name to the art it declared.
  const aliases = {};
  for (const [name, def] of Object.entries(TILE_DEFS)) {
    if (def && def.art && !(name in ART)) aliases[name] = def.art;
  }
  tileSheet.add(aliases, 'stone');

  // What each tile becomes when acted upon. `persist: true` survives leaving the
  // room, which is right for walls you blew open and wrong for bushes.

          windUp(e, g, 18, (e2, g2) => {
            spread(e2, g2, 5, 60, { sprite: 'shot', pal: 'wood', speed: 1.5, damage: 2 });
            shootRing(e2, g2, 8, { sprite: 'shot', pal: 'wood', speed: 0.9, damage: 2 });
          });
        }
        if (timer(e, 'sapling', 420) && countType(g, 'zol') < 3) summon(g, e, 'zol', 1);
        if (timer(e, 'drink', 380)) forceTide(e, g, HIGH);
      } },
      // It tears itself out of the floor and walks, mouth open, still spitting.
      { above: 0.00, ai(e, g) {
        runPending(e, g); closeTick(e, g); rootmawTide(e, g);
        chase(e, g, { speed: 0.38 });
        if (timer(e, 'seed', 105)) {
          windUp(e, g, 14, (e2, g2) => spread(e2, g2, 7, 80,
            { sprite: 'shot_spear', pal: 'wood', speed: 1.8, damage: 3 }));
        }
        if (timer(e, 'drink', 300)) forceTide(e, g, HIGH);
      } },
    ],
  });

  // The tide hook. Roots under water: bark shut, and it slowly knits back up —
  // capped so it can never win a stalemate outright. Roots in the air: bare,
  // and the mouth cannot close.
  function rootmawTide(e, g) {
    const lvl = g.tide.level;
    if (lvl === HIGH) {
      shut(e, g);
      if (timer(e, 'heal', 110) && e.hp < e.maxHp) {
        e.hp = Math.min(e.maxHp, e.hp + 1);
        g.spawnEffect('sparkle', e.cx - 8, e.cy - 4);
      }
    } else if (lvl === LOW) {
      open(e, g, 30);
      if (every(e, 45)) g.spawnEffect('dust', e.cx - 8, e.cy + 8);
    } else if (timer(e, 'breathe', 220)) {
      open(e, g, 80);
    }
  }

  // =========================================================================
  // 6 — BRINEHULK, the Salt Colossus           Salt Pan Vault (D6)
  // =========================================================================
  // A golem of packed salt. Water dissolves it, which cuts both ways: flood the
  // vault and its crust goes soft and hittable, but the thing underneath is
  // furious and fast. Let the pans dry and it re-crystallises into armour and
  // slows to a walk. It keeps draining the vault to set itself again.
  defineBoss('brinehulk', {
    hp: 60, damage: 4, pal: 'marble', speed: 0.4, rate: 13,
    w: 32, h: 32, hb: { x: 4, y: 8, w: 24, h: 22 },
    frames: ['boss_brinehulk_0', 'boss_brinehulk_1', 'boss_brinehulk_2'],
    hurtFrame: 'boss_brinehulk_hurt',
    intro: 90, shell: true, terrain: 'any', drops: 'none',
    init(e) { e._open = 0; },
    onIntro(e, g) { unlockTide(g); },
    onPhase(e, g, i) {
      if (i === 2) { summon(g, e, 'beetle', 2); g.shake(4, 22); }
    },
    phases: [
      // Walks you down and pounds the floor.
      { above: 0.62, ai(e, g) {
        runPending(e, g); closeTick(e, g);
        const rage = brinehulkCrust(e, g);
        chase(e, g, { speed: 0.4 * rage });
        if (timer(e, 'pound', 175)) brinehulkPound(e, g, 8, 1.2);
      } },
      // Hurls salt boulders at range and charges when you line up.
      { above: 0.32, ai(e, g) {
        runPending(e, g); closeTick(e, g);
        const rage = brinehulkCrust(e, g);
        charge(e, g, { speed: 1.7 * rage, tell: 22, range: 110, shake: true, tol: 13,
          idle: (e2, g2) => chase(e2, g2, { speed: 0.45 * rage }) });
        if (timer(e, 'hurl', 140)) {
          windUp(e, g, 20, (e2, g2) => spread(e2, g2, 3, 40,
            { sprite: 'shot_rock', pal: 'marble', speed: 1.6, damage: 3 }));
        }
        if (timer(e, 'dry', 400)) forceTide(e, g, LOW);
      } },
      // Cracked apart: pounds constantly and throws a wider ring each time.
      { above: 0.00, ai(e, g) {
        runPending(e, g); closeTick(e, g);
        const rage = brinehulkCrust(e, g);
        chase(e, g, { speed: 0.55 * rage });
        if (timer(e, 'pound', 110)) brinehulkPound(e, g, 12, 1.4);
        if (timer(e, 'dry', 320)) forceTide(e, g, LOW);
      } },
    ],
  });

  // The tide hook: brine eats salt. Flooded, the crust is soft the whole time
  // but the golem moves at half again its speed; dried out, it is armoured.
  function brinehulkCrust(e, g) {
    const lvl = g.tide.level;
    if (lvl === HIGH) {
      open(e, g, 30);
      if (every(e, 26)) g.spawnEffect('bubble', e.cx - 8, e.cy - 2);
      return 1.55;
    }
    if (lvl === LOW) { shut(e, g); return 0.8; }
    if (timer(e, 'flake', 240)) open(e, g, 70);
    return 1.0;
  }

  // Both arms up (tell), then down: the floor jumps and a ring of salt shards
  // goes out along it.
  function brinehulkPound(e, g, shards, speed) {
    windUp(e, g, 26, (e2, g2) => {
      g2.shake(5, 20);
      g2.audio.sfx('explode');
      shootRing(e2, g2, shards, { sprite: 'shot_rock', pal: 'marble', speed, damage: 3, life: 90 });
    });
  }

  // =========================================================================
  // 7 — THALASSOR, the Palace Eel              Reef Palace (D7)
  // =========================================================================
  // An eel long enough to cross the room, which spends most of the fight inside
  // the reef and comes out along a straight line. It spins a whirlpool that
  // drags you onto it, and the pull is only as strong as the water — drop the
  // tide and the pull dies, but a beached eel thrashes twice as fast.
  defineBoss('thalassor', {
    hp: 68, damage: 4, pal: 'reef', speed: 0.6, rate: 8,
    w: 32, h: 32, hb: { x: 4, y: 9, w: 24, h: 20 },
    frames: ['boss_thalassor_0', 'boss_thalassor_1', 'boss_thalassor_2'],
    hurtFrame: 'boss_thalassor_hurt',
    intro: 90, terrain: 'any', drops: 'none',
    onIntro(e, g) { unlockTide(g); },
    onPhase(e, g, i) {
      surface(e);                       // phase 3 leaves the reef for good
      if (i === 1) summon(g, e, 'pincer', 2);
      if (i === 2) { g.shake(4, 24); g.audio.sfx('shatter'); }
    },
    phases: [
      // In and out of the reef, lunging along whichever line you share with it.
      { above: 0.62, ai(e, g) {
        runPending(e, g);
        const dry = thalassorPull(e, g);
        if (thalassorDash(e, g)) return;
        submerge(e, g, {
          down: 80, up: 120,
          whileUp(e2, g2) {
            wander(e2, g2, { speed: 0.5 * dry, turnChance: 0.02 });
            if (every(e2, 90) && aligned(e2, g2, 16)) thalassorLunge(e2, g2, dry);
          },
        });
      } },
      // Stays up longer, spinning the whirlpool and ringing the room with spray.
      { above: 0.32, ai(e, g) {
        runPending(e, g);
        const dry = thalassorPull(e, g);
        if (thalassorDash(e, g)) return;
        submerge(e, g, {
          down: 55, up: 190,
          whileUp(e2, g2) {
            chase(e2, g2, { speed: 0.45 * dry });
            if (every(e2, 80)) thalassorLunge(e2, g2, dry);
            if (every(e2, 130)) {
              shootRing(e2, g2, 8, { sprite: 'shot_bubble', pal: 'water', speed: 1.3, damage: 3 });
            }
          },
        });
      } },
      // Out of the reef for good: a serpentine chase and aimed beams.
      { above: 0.00, ai(e, g) {
        runPending(e, g);
        const dry = thalassorPull(e, g);
        if (thalassorDash(e, g)) return;
        chase(e, g, { speed: 0.7 * dry });
        if (timer(e, 'lunge', 105)) thalassorLunge(e, g, dry);
        if (timer(e, 'beam', 85)) {
          shoot(e, g, { sprite: 'shot_beam', pal: 'reef', speed: 2.2, aim: true, damage: 3 });
        }
        if (timer(e, 'flood', 340)) forceTide(e, g, HIGH);
      } },
    ],
  });

  // The tide hook: the whirlpool drags the player in, and its strength is the
  // water level. Beached at LOW it cannot pull at all — and thrashes for it.
  function thalassorPull(e, g) {
    const lvl = g.tide.level;
    const strength = [0, 0.22, 0.5][lvl];
    const p = g.player;
    if (strength > 0 && p && !e.hidden) {
      const dx = e.cx - p.cx, dy = e.cy - p.cy, d = Math.hypot(dx, dy) || 1;
      if (d < 96) moveEntity(g, p, sp((dx / d) * strength), sp((dy / d) * strength));
      if (every(e, 20)) g.spawnEffect('ripple', e.cx - 8, e.cy - 8, { life: 24 });
    }
    return lvl === LOW ? 1.9 : 1.0;   // beached: no pull, but twice the thrash
  }

  // Rears back out of the water (frozen tell), then snaps the length of the
  // room along whichever line it was facing.
  function thalassorLunge(e, g, dry) {
    windUp(e, g, 18, (e2, g2) => {
      facePlayer(e2, g2);
      g2.audio.sfx('charge');
      e2._lunge = 26;
      e2._lungeSpeed = 2.4 * dry;
    });
  }

  /** Drive an in-flight lunge. Returns true while it owns the boss's movement. */
  function thalassorDash(e, g) {
    if (!e._lunge || e._lunge <= 0) return false;
    e._lunge--;
    if (!moveDir(e, g, e.dir, e._lungeSpeed || 2.4)) {
      e._lunge = 0;                     // hit the reef wall: recoil
      e.stun = 20;
      g.shake(3, 10);
    }
    return true;
  }

  // =========================================================================
  // 8 — NERETH, the Drowned King               Abyssal Keep (D8)
  // =========================================================================
  // The long one. Nereth holds the sea where he wants it: each phase he pins
  // the tide to one level, and while it sits at his level he is sealed inside
  // his own water and nothing touches him. Break the pin with the conch and he
  // is open until he can force it back. Three phases, three different pins —
  // the keep's whole tide theme is "all three levels in one room" — and then a
  // fourth where he stops pinning and cycles the sea himself.
  defineBoss('nereth', {
    hp: 80, damage: 4, pal: 'abyss', speed: 0.6, rate: 9,
    w: 32, h: 32, hb: { x: 4, y: 8, w: 24, h: 22 },
    frames: ['boss_nereth_0', 'boss_nereth_1', 'boss_nereth_2', 'boss_nereth_3'],
    hurtFrame: 'boss_nereth_hurt',
    intro: 120, shell: true, terrain: 'any', drops: 'none',
    init(e) { e._open = 0; e._sweep = 0; },
    onIntro(e, g) { unlockTide(g); },
    onPhase(e, g, i) {
      g.shake(4, 22);
      if (i === 1) summon(g, e, 'wizzrobe', 1);
      if (i === 2) summon(g, e, 'stalfos', 2);
      // Phase 4 opens on its own cycle timer; give the player a window at once
      // rather than up to 200 sealed frames on arrival.
      if (i === 3) { g.audio.sfx('shatter'); summon(g, e, 'darknut', 1); open(e, g, 120); }
    },
    phases: [
      // Pins the sea at MID and throws his tridents.
      { above: 0.75, ai(e, g) {
        runPending(e, g); nerethPin(e, g, MID, 300);
        chase(e, g, { speed: 0.5 });
        if (timer(e, 'trident', 130)) {
          windUp(e, g, 22, (e2, g2) => {
            spread(e2, g2, 3, 36, { sprite: 'shot_spear', pal: 'abyss', speed: 2.0, damage: 3 });
            nerethOpening(e2, g2);
          });
        }
      } },
      // Floods the keep and swims it, fast, ringing the room with water.
      { above: 0.50, ai(e, g) {
        runPending(e, g); nerethPin(e, g, HIGH, 280);
        chase(e, g, { speed: 1.05 });
        if (timer(e, 'ring', 150)) {
          windUp(e, g, 18, (e2, g2) => {
            shootRing(e2, g2, 10, { sprite: 'shot_bubble', pal: 'water', speed: 1.4, damage: 3 });
            nerethOpening(e2, g2);
          });
        }
        if (timer(e, 'summon', 520) && countType(g, 'wizzrobe') < 2) summon(g, e, 'wizzrobe', 1);
      } },
      // Drains it to the bare rock, plants the trident and sweeps beams round.
      { above: 0.25, ai(e, g) {
        runPending(e, g); nerethPin(e, g, LOW, 260);
        if (every(e, 22)) {
          e._sweep += 0.36;
          shootRing(e, g, 3, { sprite: 'shot_beam', pal: 'magic', speed: 1.5,
            damage: 3, offset: e._sweep });
        }
        if (timer(e, 'step', 4)) moveDir(e, g, e.dir, 0.4);
        if (timer(e, 'face', 60)) facePlayer(e, g);
        // The sweep runs continuously, so the opening is when he re-seats the
        // planted trident between passes.
        if (timer(e, 'reseat', 190)) {
          windUp(e, g, 20, (e2, g2) => { g2.shake(2, 10); nerethOpening(e2, g2); });
        }
        if (timer(e, 'summon', 460) && countType(g, 'stalfos') < 3) summon(g, e, 'stalfos', 1);
      } },
      // No more pinning. He works the sea through all three states himself and
      // throws everything; the openings are the moments the water is moving.
      { above: 0.00, ai(e, g) {
        runPending(e, g);
        closeTick(e, g);
        if (timer(e, 'cycle', 200)) {
          windUp(e, g, 26, (e2, g2) => {
            forceTide(e2, g2, (g2.tide.level + 1) % 3);
            open(e2, g2, 150);            // the sea is loose; so is he
          }, 'sparkle');
        }
        chase(e, g, { speed: 0.85 });
        if (timer(e, 'trident', 100)) {
          spread(e, g, 5, 60, { sprite: 'shot_spear', pal: 'abyss', speed: 2.1, damage: 3 });
        }
        if (timer(e, 'ring', 170)) {
          shootRing(e, g, 12, { sprite: 'shot_bubble', pal: 'water', speed: 1.5, damage: 3 });
        }
        if (timer(e, 'summon', 400) && countType(g, 'keese') < 4) summon(g, e, 'keese', 2);
      } },
    ],
  });

  // The pin. While the sea sits where Nereth put it he is sealed inside it, and
  // the only way in is the moment after he throws something — every attack in
  // his first three phases ends with `nerethOpening`. Break the pin with the
  // conch and that grudging window becomes a standing one, until he shoves the
  // sea back on a timer you can hear coming.
  //
  // He must never be *only* breakable by the conch: he starts the fight pinned
  // to MID, which is where the player walks in, so a pure tide gate would mean
  // an invulnerable boss and no way to learn otherwise.
  function nerethPin(e, g, level, period) {
    if (g.tide.level === level) {
      closeTick(e, g);
      if (timer(e, 'seal', 200)) g.spawnEffect('shine', e.cx - 8, e.cy - 8, { life: 24 });
    } else {
      open(e, g, 60);
      if (timer(e, 'pin', period)) {
        windUp(e, g, 26, (e2, g2) => forceTide(e2, g2, level), 'sparkle');
      }
    }
  }

  /** The recovery window after one of Nereth's attacks: he is open as he resets. */
  function nerethOpening(e, g) { open(e, g, 55); }

  /** How many of a minion type are already out — keeps summons from stacking. */
  function countType(g, type) {
    let n = 0;
    for (const x of g.entities) if (x.type === type && !x.dead) n++;
    return n;
  }

  // --- D4 Ironknight: a Darknut with a cistern's worth of armour ----------

  // --- D5 Thornvine: rooted, and it fills the room with thorns ------------
  defineBoss('thornvine', {
    hp: 16, damage: 3, pal: 'tree', speed: 0, rate: 12,
    w: 24, h: 24, hb: { x: 3, y: 6, w: 18, h: 17 },
    frames: ['mini_thornvine_0', 'mini_thornvine_1'],
    intro: 40, terrain: 'any', drops: 'rich',

      { above: 0.50, ai(e, g) {
