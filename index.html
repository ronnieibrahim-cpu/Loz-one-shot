<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0f14;overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:monospace;color:#8fa}
  /* iOS Safari: kill rubber-band scroll, pull-to-refresh and the long-press
     text-selection callout. touch-action:none on #touch alone only stops
     gestures that start on the touch layer itself — a drag that starts on
     the letterboxed background around the canvas still rubber-bands the
     whole page without these. */
  html{position:fixed;inset:0;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%;overscroll-behavior:none;
    touch-action:none;-webkit-touch-callout:none}
  canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #screen{
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    background:#000;
    box-shadow:0 0 0 4px #1a2530, 0 0 48px rgba(60,120,90,.25);
  }
  #shell{position:relative}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b0f14;z-index:10;font-size:13px;letter-spacing:1px}
  #boot.hidden{display:none}
  #err{position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;
    background:#2a0d12;color:#ffb3c0;font-size:11px;padding:8px;white-space:pre-wrap;
    display:none;z-index:20;border-top:2px solid #ff5c7a}
  /* Touch controls: only shown on touch devices */
  #touch{position:fixed;inset:0;z-index:5;display:none;touch-action:none}
  body.touch #touch{display:block}
  .tbtn{position:absolute;border-radius:50%;background:rgba(200,230,210,.13);
    border:2px solid rgba(200,230,210,.28);color:#cfe;display:flex;
    align-items:center;justify-content:center;font-size:14px;user-select:none}
  .tbtn.act{background:rgba(200,230,210,.35)}
  /* Safe-area insets keep the pad/buttons clear of the home indicator and the
     rounded-corner curve in both orientations — env() falls back to 0 on a
     device with no notch/indicator, so this is a no-op everywhere else. */
  #dpad{position:absolute;left:calc(4% + env(safe-area-inset-left));
    bottom:calc(6% + env(safe-area-inset-bottom));width:150px;height:150px}
  #dpad .tbtn{width:48px;height:48px;border-radius:8px}
  #btns{position:absolute;right:calc(5% + env(safe-area-inset-right));
    bottom:calc(8% + env(safe-area-inset-bottom));width:170px;height:130px}
  #btns .tbtn{width:58px;height:58px}
  #sysbtns{position:absolute;right:calc(5% + env(safe-area-inset-right));
    top:calc(4% + env(safe-area-inset-top))}
  #sysbtns .tbtn{width:46px;height:30px;border-radius:6px;position:relative;
    display:inline-flex;margin-left:6px;font-size:10px}
</style>
</head>
<body>
<div id="boot">LOADING&hellip;</div>
<div id="wrap"><div id="shell"><canvas id="screen" width="160" height="144"></canvas></div></div>
<div id="touch">
  <div id="dpad">
    <div class="tbtn" data-k="up"    style="left:51px;top:0"></div>
    <div class="tbtn" data-k="left"  style="left:0;top:51px"></div>
    <div class="tbtn" data-k="right" style="left:102px;top:51px"></div>
    <div class="tbtn" data-k="down"  style="left:51px;top:102px"></div>
  </div>
  <div id="btns">
    <div class="tbtn" data-k="b" style="left:0;top:36px">B</div>
    <div class="tbtn" data-k="a" style="left:86px;top:0">A</div>
  </div>
  <div id="sysbtns">
    <div class="tbtn" data-k="select">SEL</div>
    <div class="tbtn" data-k="start">START</div>
  </div>
</div>
<div id="err"></div>
<script>
  // Surface load/runtime errors on-screen; a black canvas is useless for debugging.
  (function(){
    var box = document.getElementById('err');
    function show(msg){
      box.style.display='block';
      box.textContent += msg + '\n';
      document.getElementById('boot').classList.add('hidden');
    }
    window.addEventListener('error', function(e){
      show('ERROR: ' + (e.message||e.type) + (e.filename? ('\n  at '+e.filename+':'+e.lineno):''));
    });
    window.addEventListener('unhandledrejection', function(e){
      show('PROMISE REJECTION: ' + (e.reason && (e.reason.stack||e.reason.message) || e.reason));
    });
    window.__showError = show;
  })();
</script>
<script>
  // iOS Safari still finds ways to scroll/zoom a fixed-position, touch-action:none
  // page: pinch-zoom (gesturestart/change/end), the two-finger and double-tap
  // zoom shortcuts, and a stray touchmove that starts outside any element with
  // its own touch-action. None of those are needed by a game with no scrolling
  // content, so they are all blocked at the document level rather than relying
  // on any one CSS property to cover every case.
  (function(){
    var doc = document;
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){
      doc.addEventListener(t, function(e){ e.preventDefault(); }, { passive: false });
    });
    doc.addEventListener('touchmove', function(e){
      if (e.touches.length > 1) e.preventDefault();   // pinch
    }, { passive: false });
    // Double-tap-to-zoom: iOS ignores user-scalable=no for the two-tap gesture
    // on some versions, so the second tap of a fast pair is cancelled by hand.
    var lastTouchEnd = 0;
    doc.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
  })();
</script>
