<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle of Tides Player's Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Silkscreen&display=swap">
<style>
/* Colours. The markup lime is the same lime drawn on every picture, so a
   numbered step in the text and a numbered circle on a screenshot are
   visibly the same thing. */
:root {
  color-scheme: light;
  --bg: #edf2f4;
  --panel: #ffffff;
  --ink: #14212b;
  --muted: #52616c;
  --rule: #cbd6dc;
  --sea: #0d6674;
  --sea-soft: #d6eaee;
  --bar: #0d6674;
  --lime: #c8ff00;
  --lime-ink: #000000;
  --warn-bg: #fff3d6;
  --warn-rule: #e1b547;
  --shot-bg: #0b1118;
  --low: #3a7d44; --mid: #1f6aa5; --high: #1b3f8f;
  --head: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --pixel: "Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d151c; --panel: #152029; --ink: #e2ebf0; --muted: #98a8b3; --rule: #263542;
    --sea: #6cc9d4; --sea-soft: #173540; --bar: #0e3942; --warn-bg: #2f2710; --warn-rule: #8c7127; --shot-bg: #000;
    --low: #7cc487; --mid: #6fb1e6; --high: #9fb4f2;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d151c; --panel: #152029; --ink: #e2ebf0; --muted: #98a8b3; --rule: #263542;
  --sea: #6cc9d4; --sea-soft: #173540; --bar: #0e3942; --warn-bg: #2f2710; --warn-rule: #8c7127; --shot-bg: #000;
  --low: #7cc487; --mid: #6fb1e6; --high: #9fb4f2;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + 12px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 var(--body);
}
a { color: var(--sea); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

/* ---- top bar -------------------------------------------------------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--bar-h); display: flex; align-items: center; gap: 12px;
  padding-inline: 16px; background: var(--bar); color: #fff;
  box-shadow: 0 1px 0 rgba(0,0,0,.25);
}
.bar .name { font: 700 clamp(16px, 4.6vw, 19px)/1.1 var(--head); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.bar .name small { font: 11px var(--pixel); opacity: .8; letter-spacing: .06em; margin-left: 6px; }
.bar button {
  font: 700 clamp(13px, 3.8vw, 15px) var(--head); letter-spacing: .04em; text-transform: uppercase;
  background: var(--lime); color: var(--lime-ink); border: 2px solid #000; border-radius: 6px;
  padding: 6px clamp(8px, 2.5vw, 12px); cursor: pointer; white-space: nowrap;
}
@media (max-width: 420px) { .bar .name small { display: none; } .bar { gap: 10px; } }

/* ---- contents drawer (phone) / sidebar (desktop) --------------------- */
.nav {
  position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(88vw, 340px);
  background: var(--panel); border-right: 1px solid var(--rule);
  transform: translateX(-102%); transition: transform .2s ease;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
.nav header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.nav header b { font: 700 18px var(--head); letter-spacing: .03em; text-transform: uppercase; }
.nav header button { background: none; border: 0; color: var(--ink); font-size: 28px; line-height: 1; cursor: pointer; padding: 0 4px; }
.nav .scroll { overflow-y: auto; padding: 8px 8px 24px; -webkit-overflow-scrolling: touch; }
.toc, .toc ol { list-style: none; margin: 0; padding: 0; }
.toc > li > a { display: block; font: 700 16px/1.25 var(--head); padding: 9px 8px 5px; color: var(--ink); text-decoration: none; letter-spacing: .01em; }
.toc ol a { display: block; font-size: 14.5px; line-height: 1.3; padding: 5px 8px 5px 20px; color: var(--muted); text-decoration: none; border-left: 2px solid transparent; }
.toc a:hover { color: var(--sea); }
.toc a.here { color: var(--ink); border-left-color: var(--lime); background: var(--sea-soft); }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.4); }

/* ---- page ------------------------------------------------------------ */
main { padding-inline: 16px; padding-block: 8px 80px; }
.page { max-width: 760px; margin: 0 auto; }
@media (min-width: 1120px) {
  .bar .menu { display: none; }
  .nav { transform: none; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); width: 300px; box-shadow: none; }
  .nav header { display: none; }
  .scrim { display: none; }
  main { margin-left: 300px; }
}
h1, h2, h3, h4 { font-family: var(--head); text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(34px, 8vw, 52px); margin: 0; letter-spacing: -.01em; }
h2 {
  font-size: clamp(28px, 6.5vw, 38px); margin: 56px 0 12px; padding-top: 14px;
  border-top: 6px solid var(--ink);
}
h2 .ch { display: block; font: 12px var(--pixel); letter-spacing: .12em; color: var(--sea); margin-bottom: 6px; }
h3 { font-size: 24px; margin: 40px 0 8px; }
h3 .room { font: 11px var(--pixel); letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 4px; }
h4 { font-size: 19px; margin: 24px 0 6px; }
p, li { max-width: 68ch; }
.lede { font-size: 19px; color: var(--muted); }

/* hero */
.hero { padding-block: 20px 8px; }
.hero .kicker { font: 12px var(--pixel); letter-spacing: .14em; color: var(--sea); }
.hero p { margin: 10px 0 0; }

/* numbered steps: the same lime disc as on the pictures */
ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 14px 0; display: grid; gap: 10px; }
ol.steps > li { counter-increment: s; position: relative; padding-left: 42px; }
ol.steps > li::before {
  content: counter(s); position: absolute; left: 0; top: 0;
  width: 30px; height: 30px; border-radius: 50%; background: var(--lime); color: var(--lime-ink);
  border: 2px solid #000; font: 700 16px/26px var(--head); text-align: center;
}
ol.steps[start] { counter-reset: s calc(var(--start, 1) - 1); }

/* callouts */
.nudge, .stuck, .note, .fight {
  border-radius: 10px; padding: 12px 16px; margin: 18px 0; border: 1px solid var(--rule); background: var(--panel);
}
.nudge { border: 2px solid var(--ink); }
.nudge .lbl, .stuck .lbl, .note .lbl, .fight .lbl { display: block; font: 11px var(--pixel); letter-spacing: .1em; margin-bottom: 4px; color: var(--sea); }
.nudge p { margin: 0; font-size: 18px; font-weight: 700; }
.stuck { background: var(--warn-bg); border-color: var(--warn-rule); }
.stuck ol { margin: 6px 0 0; padding-left: 22px; }
.fight { border-left: 6px solid #c0392b; }
.solution-head { font: 12px var(--pixel); letter-spacing: .12em; color: var(--muted); margin: 22px 0 0; display: flex; align-items: center; gap: 10px; }
.solution-head::after { content: ""; flex: 1; border-top: 2px dashed var(--rule); }

/* tide chips */
.t { display: inline-block; font: 700 12px/1 var(--head); letter-spacing: .08em; color: #fff; padding: 4px 6px 3px; border-radius: 4px; vertical-align: 2px; }
.t.low { background: #3a7d44; } .t.mid { background: #1f6aa5; } .t.high { background: #1b3f8f; }
kbd { font: 700 13px var(--body); border: 1px solid var(--rule); border-bottom-width: 3px; border-radius: 5px; padding: 1px 6px; background: var(--panel); white-space: nowrap; }
.btn { display: inline-block; font: 700 13px/1 var(--head); min-width: 22px; text-align: center; padding: 4px 6px 3px; border-radius: 50%; background: var(--ink); color: var(--bg); }

/* pictures */
figure.shot { margin: 18px 0; }
figure.shot button.zoom { display: block; width: 100%; padding: 0; border: 0; background: var(--shot-bg); cursor: zoom-in; border-radius: 6px; overflow: hidden; }
figure.shot img { display: block; width: 100%; height: auto; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
figure.shot.small { max-width: 480px; }
figure.shot.map img { image-rendering: auto; }
figcaption { font-size: 14.5px; line-height: 1.45; color: var(--muted); margin-top: 7px; }
.figs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin: 18px 0; }
@media (min-width: 620px) { .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.figs figure.shot { margin: 0; }
@media (min-width: 900px) { .figs.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* tables */
.tbl { overflow-x: auto; margin: 14px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 700 14px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
td:first-child { white-space: nowrap; }

/* checklist */
ul.check { list-style: none; padding: 0; }
ul.check li { display: grid; grid-template-columns: 28px 1fr; gap: 6px; margin: 8px 0; }
ul.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--sea); }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(4,8,12,.94); display: flex; flex-direction: column; }
.lb .lbbar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; color: #fff; gap: 12px; }
.lb .lbbar span { font-size: 14px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .lbbar button { background: var(--lime); color: #000; border: 2px solid #000; border-radius: 6px; font: 700 15px var(--head); padding: 6px 12px; cursor: pointer; }
.lb .lbimg { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 0 8px 16px; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; }
.lb img { image-rendering: pixelated; image-rendering: crisp-edges; max-width: none; margin: auto; }
.missing { color: #c0392b; font-weight: 700; }
footer { margin-top: 60px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { .nav { transition: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="bar">
  <button class="menu" type="button" id="menuBtn" aria-controls="nav" aria-expanded="false">Contents</button>
  <div class="name">Oracle of Tides <small>GUIDE</small></div>
  <button type="button" id="themeBtn" aria-label="Switch light or dark">◐</button>
</div>
<nav class="nav" id="nav" aria-label="Contents">
  <header><b>Contents</b><button type="button" id="navClose" aria-label="Close contents">×</button></header>
  <div class="scroll"><!--TOC--></div>
</nav>
<div class="scrim" id="scrim" hidden></div>
<main><div class="page">
<!--CONTENT-->
</div></main>
<script>
(function () {
  var nav = document.getElementById('nav'), scrim = document.getElementById('scrim'), btn = document.getElementById('menuBtn');
  function setNav(open) {
    nav.classList.toggle('open', open); scrim.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { setNav(!nav.classList.contains('open')); });
  document.getElementById('navClose').addEventListener('click', function () { setNav(false); });
  scrim.addEventListener('click', function () { setNav(false); });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) setNav(false); });

  // Light / dark: follows the device until pressed, then remembered.
  var root = document.documentElement;
  try { var saved = localStorage.getItem('oot-guide-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('oot-guide-theme', next); } catch (e) {}
  });

  // Tap a picture to see it bigger, at a whole-number scale so pixels stay square.
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button.zoom'); if (!b) return;
    var img = b.querySelector('img'), cap = b.parentNode.querySelector('figcaption');
    var lb = document.createElement('div'); lb.className = 'lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-label', 'Enlarged picture');
    var bar = document.createElement('div'); bar.className = 'lbbar';
    var t = document.createElement('span'); t.textContent = cap ? cap.textContent : img.alt;
    var x = document.createElement('button'); x.type = 'button'; x.textContent = 'Close';
    bar.appendChild(t); bar.appendChild(x);
    var wrap = document.createElement('div'); wrap.className = 'lbimg';
    var big = new Image(); big.src = img.src; big.alt = img.alt;
    var nw = img.naturalWidth || +img.getAttribute('width'), vw = window.innerWidth - 16;
    var k = nw <= vw ? Math.max(1, Math.floor(vw / nw)) : vw / nw;
    if (nw > vw && nw <= 2 * vw) k = vw / nw;
    big.style.width = Math.round(nw * Math.min(k, 3)) + 'px';
    if (nw > vw * 1.6) big.style.width = nw + 'px';   // a big map: scroll it at full size
    wrap.appendChild(big);
    lb.appendChild(bar); lb.appendChild(wrap); document.body.appendChild(lb);
    function close() { lb.remove(); document.removeEventListener('keydown', key); b.focus(); }
    function key(ev) { if (ev.key === 'Escape') close(); }
    x.addEventListener('click', close); document.addEventListener('keydown', key); x.focus();
  });

  // Mark the section you are reading in the contents.
  var links = [].slice.call(document.querySelectorAll('.toc a'));
  var map = {}; links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
  var heads = [].slice.call(document.querySelectorAll('h2[id], h3[id]'));
  var ticking = false;
  function mark() {
    ticking = false;
    var cur = null;
    for (var i = 0; i < heads.length; i++) { if (heads[i].getBoundingClientRect().top < 120) cur = heads[i]; else break; }
    links.forEach(function (a) { a.classList.remove('here'); });
    if (cur && map[cur.id]) map[cur.id].classList.add('here');
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(mark); } }, { passive: true });
  mark();

  // Checklist ticks are remembered on this device only.
  [].forEach.call(document.querySelectorAll('ul.check input'), function (c) {
    try { c.checked = localStorage.getItem('oot-guide-' + c.id) === '1'; } catch (e) {}
    c.addEventListener('change', function () { try { localStorage.setItem('oot-guide-' + c.id, c.checked ? '1' : '0'); } catch (e) {} });
  });
})();
</script>
</body>
</html>
